function appendPhotoFeedbackPanel(photo,host){
 if(photo.read_only||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(photo.id)))return;

}
