$('#fixture-deploy').onclick=()=>{queue=[];pzGatherEdges();for(const message of queue){const reply=fixtureServerHandle.call(server,{id:7,name:'Fixture player',avatar:''},message,null);if(reply)broadcasts.push(reply);}PZ.data.pieces=structuredClone(server.pieces);PZ.order=null;paint();audit();};$('#fixture-reset').onclick=reset;window.addEventListener('resize',paint);reset();
</script></body></html>
