<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';connect-src 'none';form-action 'none';base-uri 'none'"><title>Isolated Ohana10 gesture check</title><style>body{margin:0;padding:16px;background:#17473e;color:#fff7dc;font:17px/1.4 system-ui}h1{font-size:24px;margin:0 0 8px}button,input{min-height:44px}button{font:700 17px system-ui;padding:8px;margin:3px}#rack{display:flex;gap:8px;overflow-x:auto;min-height:160px;align-items:center;padding:8px 2px;touch-action:pan-x pan-y pinch-zoom}.test-card{flex:0 0 76px;width:76px;height:120px;background:#fff1cf;color:#173f37;border:2px solid #cfaa64;border-radius:8px;box-sizing:border-box}.test-card[aria-pressed=true]{outline:3px solid #f8c34d}.test-card:nth-child(2n){background:#bfe4ed}.test-card:nth-child(3){background:#d3e5b4}.hand-arrange-ghost{opacity:.8}.hand-drop-before{outline:4px solid #f8c34d;outline-offset:2px}.hand-drop-after{outline:4px solid #ef895e;outline-offset:2px}.pass{color:#c9ffc9}.fail{color:#ffb5ad}li{margin:9px 0}#results{padding-left:24px}label{display:inline-flex;align-items:center;gap:8px}#summary{font-weight:700}small{display:block}</style></head><body><h1>Isolated Ohana10 gesture check</h1><p>Fictional cards and local display order only. This uses the candidate’s actual gesture handler. No family game or saved data is available.</p><label><input type="checkbox" id="mode" checked>Arrange cards</label><button id="reset">Reset local cards</button><div id="rack" aria-label="Fictional cards"></div><p id="order"></p><p id="plays"></p><p id="announce" role="status"></p><button id="run">Run SIMULATED finger checks</button><p id="summary" role="status">You can also drag these cards with a mouse. Synthetic TouchEvents do not prove physical phone gestures or pinch zoom.</p><ol id="results"></ol><script>'use strict';
const S={o10ArrangeMode:true},cards=[{id:1,label:'Coral 5'},{id:2,label:'Ocean 8'},{id:3,label:'Leaf 2'},{id:4,label:'Sun 11'}];let order=[1,2,3,4],plays=0,lastPrevented=false;
function accessibleAnnounce(text){document.querySelector('#announce').textContent=text;}
function bindHandArrange(buttons,attribute,hand,reorder){
 const cards=[...buttons];
 for(const b of cards){
  const id=Number(b.getAttribute(attribute));let drag=null;
  const directTouchArrange=attribute==='data-o10-card'&&!!S.o10ArrangeMode;
  if(directTouchArrange)b.style.setProperty('touch-action','pinch-zoom','important');
  b.setAttribute('aria-description',directTouchArrange?'Slide this card to rearrange it, or tap it and use Move earlier or Move later. Use two fingers to zoom.':'Hold a card, then slide to rearrange. Swipe promptly to scroll; use two fingers to zoom. Alt plus arrow keys also moves this card.');
  b.addEventListener('click',e=>{if(Date.now()<(S.handArrangeIgnoreUntil||0)){e.preventDefault();e.stopImmediatePropagation();}},true);
  b.onkeydown=e=>{if(!e.altKey||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=hand.findIndex(c=>c.id===id),delta=e.key==='ArrowLeft'?-1:1,target=hand[i+delta];if(target)reorder(id,target.id,delta>0);};
  let pressTimer=null;const clean=()=>{clearTimeout(pressTimer);pressTimer=null;drag?.ghost?.remove();b.classList.remove('o10-dragging','hand-reorder-ready');cards.forEach(c=>c.classList.remove('hand-drop-before','hand-drop-after'));drag=null;};
  b.onpointerdown=e=>{if(!e.isPrimary||e.button!==0||e.pointerType==='touch')return;drag={pointer:e.pointerId,x:e.clientX,y:e.clientY,started:Date.now(),touch:e.pointerType==='touch'};try{b.setPointerCapture(e.pointerId);}catch{}};
  b.onpointermove=e=>{
   if(!drag||drag.pointer!==e.pointerId)return;
   if(!drag.ghost){const distance=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(distance<(drag.touch?12:7))return;if(drag.touch&&!drag.direct&&Date.now()-drag.started<250){clean();return;}}
   if(!drag.ghost){const rect=b.getBoundingClientRect();drag.ghost=b.cloneNode(true);drag.ghost.removeAttribute(attribute);drag.ghost.removeAttribute('id');drag.ghost.setAttribute('aria-hidden','true');drag.ghost.classList.add('hand-arrange-ghost');drag.ghost.style.cssText='position:fixed!important;pointer-events:none!important;z-index:10000!important;width:'+rect.width+'px!important;height:'+rect.height+'px!important;margin:0!important;';drag.ghost.tabIndex=-1;b.parentElement.append(drag.ghost);drag.width=rect.width;drag.height=rect.height;b.classList.add('o10-dragging');}
   e.preventDefault();drag.ghost.style.left=(e.clientX-drag.width/2)+'px';drag.ghost.style.top=(e.clientY-drag.height/2)+'px';
   cards.forEach(c=>c.classList.remove('hand-drop-before','hand-drop-after'));
   const rack=b.parentElement,r=rack.getBoundingClientRect();let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('['+attribute+']');
   if(!cards.includes(target)&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top-24&&e.clientY<=r.bottom+24){target=cards.reduce((best,c)=>{const cr=c.getBoundingClientRect(),distance=Math.hypot(e.clientX-cr.left-cr.width/2,e.clientY-cr.top-cr.height/2);return !best||distance<best.distance?{card:c,distance}:best;},null)?.card;}
   drag.target=null;if(target&&target!==b){const rect=target.getBoundingClientRect();drag.target=Number(target.getAttribute(attribute));drag.after=e.clientX>rect.left+rect.width/2;target.classList.add(drag.after?'hand-drop-after':'hand-drop-before');}
  };
  b.onpointerup=e=>{if(!drag||drag.pointer!==e.pointerId)return;const {target,after,ghost}=drag;if(ghost){e.preventDefault();S.handArrangeIgnoreUntil=Date.now()+450;}clean();if(ghost&&target!=null){reorder(id,target,after);accessibleAnnounce('Card moved in your hand.');}};
  b.addEventListener('touchstart',e=>{clean();if(e.touches.length!==1){S.handArrangeIgnoreUntil=Date.now()+450;return;}const t=e.touches[0];drag={pointer:t.identifier,x:t.clientX,y:t.clientY,started:Date.now(),touch:true,armed:directTouchArrange,direct:directTouchArrange,moved:false};if(directTouchArrange){b.classList.add('hand-reorder-ready');return;}pressTimer=setTimeout(()=>{if(drag?.pointer===t.identifier){drag.armed=true;b.classList.add('hand-reorder-ready');}},350);},{passive:true});
  b.addEventListener('touchmove',e=>{if(!drag?.touch)return;if(drag.direct&&(!S.o10ArrangeMode||!b.isConnected)){S.handArrangeIgnoreUntil=Date.now()+450;clean();return;}if(e.touches.length!==1){S.handArrangeIgnoreUntil=Date.now()+450;clean();return;}const t=e.touches[0];if(drag.direct&&Math.hypot(t.clientX-drag.x,t.clientY-drag.y)>8)drag.moved=true;if(!drag.armed){if(Math.hypot(t.clientX-drag.x,t.clientY-drag.y)>8)clean();return;}if(e.cancelable)e.preventDefault();b.onpointermove({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault(){if(e.cancelable)e.preventDefault();}});},{passive:false});
  b.addEventListener('touchend',e=>{if(!drag?.touch)return;const t=[...e.changedTouches].find(t=>t.identifier===drag.pointer);if(!t)return;const direct=drag.direct,tap=direct&&!drag.ghost&&!drag.moved;if(direct&&(!S.o10ArrangeMode||!b.isConnected)){S.handArrangeIgnoreUntil=Date.now()+450;clean();return;}b.onpointerup({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,preventDefault(){if(e.cancelable)e.preventDefault();}});if(direct){if(e.cancelable)e.preventDefault();S.handArrangeIgnoreUntil=Date.now()+450;if(tap)b.onclick?.();}},{passive:false});
  b.addEventListener('touchcancel',()=>{if(drag?.direct)S.handArrangeIgnoreUntil=Date.now()+450;clean();},{passive:true});
  // Touch Events own the touch reorder lifecycle; Pointer cancellation must not erase it.
   const cancelPointer=()=>{if(!drag?.touch)clean();};b.onpointercancel=cancelPointer;b.onlostpointercapture=cancelPointer;b.ondragstart=e=>e.preventDefault();
 }
}

function paint(kind='o10'){const rack=document.querySelector('#rack');rack.replaceChildren();for(const id of order){const card=cards.find(c=>c.id===id),button=document.createElement('button');button.type='button';button.className='test-card';button.dataset[kind==='o10'?'o10Card':'cid']=String(id);button.textContent=card.label;button.onclick=()=>{if(S.o10ArrangeMode&&kind==='o10'){S.o10ArrangeCard=id;for(const other of rack.children)other.setAttribute('aria-pressed',String(other===button));accessibleAnnounce(card.label+' selected for arranging. Drag it to another card.');}else{plays++;document.querySelector('#plays').textContent='Local tap selections: '+plays;}};rack.append(button);}const hand=order.map(id=>cards.find(c=>c.id===id));bindHandArrange(rack.children,kind==='o10'?'data-o10-card':'data-cid',hand,(id,target,after)=>{const ids=order.filter(n=>n!==id),index=ids.indexOf(target);if(index<0)return;ids.splice(index+(after?1:0),0,id);order=ids;paint(kind);});document.querySelector('#order').textContent='Local order: '+order.join(', ');}
function reset(kind='o10',mode=true){order=[1,2,3,4];plays=0;S.o10ArrangeMode=mode;S.handArrangeIgnoreUntil=0;document.querySelector('#mode').checked=mode;document.querySelector('#plays').textContent='Local tap selections: 0';paint(kind);}
function point(id,dx=0){const e=document.querySelector('[data-o10-card="'+id+'"],[data-cid="'+id+'"]'),r=e.getBoundingClientRect();return{id:31,x:r.left+r.width/2+dx,y:r.top+r.height/2};}
function emitTouch(el,type,points,changed=points){const make=p=>new Touch({identifier:p.id,target:el,clientX:p.x,clientY:p.y,pageX:p.x+scrollX,pageY:p.y+scrollY,screenX:p.x,screenY:p.y});const e=new TouchEvent(type,{bubbles:true,cancelable:true,touches:points.map(make),targetTouches:points.map(make),changedTouches:changed.map(make)});el.dispatchEvent(e);lastPrevented=e.defaultPrevented;return e;}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function check(ok,text){const li=document.createElement('li');li.textContent=(ok?'PASS: ':'FAIL: ')+text;li.className=ok?'pass':'fail';document.querySelector('#results').append(li);if(!ok)throw Error(text);}
async function run(){document.querySelector('#run').disabled=true;document.querySelector('#results').replaceChildren();try{
 reset();let e=document.querySelector('[data-o10-card="1"]'),p=point(1),q=point(2,8);emitTouch(e,'touchstart',[p]);emitTouch(e,'touchmove',[q]);emitTouch(e,'touchend',[],[q]);check(order.join(',')==='2,1,3,4','SIMULATED direct finger drag moves first card after second without holding');check(plays===0,'Arranging does not select a card for play');check(!document.querySelector('.hand-arrange-ghost'),'Drag ghost clears after drop');
 reset();e=document.querySelector('[data-o10-card="1"]');p=point(1);emitTouch(e,'touchstart',[p]);emitTouch(e,'touchend',[],[p]);e.click();check(order.join(',')==='1,2,3,4'&&plays===0,'Arrange-mode tap does not reorder or play');
 reset();e=document.querySelector('[data-o10-card="1"]');p=point(1);q=point(2,8);emitTouch(e,'touchstart',[p]);emitTouch(e,'touchmove',[q]);emitTouch(e,'touchcancel',[],[q]);check(order.join(',')==='1,2,3,4'&&!document.querySelector('.hand-arrange-ghost'),'Cancelled drag preserves local order and clears ghost');
 reset();e=document.querySelector('[data-o10-card="1"]');p=point(1);const second={id:32,x:p.x+22,y:p.y+10};emitTouch(e,'touchstart',[p]);const multi=emitTouch(e,'touchmove',[p,second]);check(!multi.defaultPrevented&&order.join(',')==='1,2,3,4'&&!document.querySelector('.hand-arrange-ghost'),'SIMULATED second finger cancels reorder and event remains unprevented (physical pinch zoom remains device testing)');emitTouch(e,'touchcancel',[],[p,second]);
 reset('o10',false);e=document.querySelector('[data-o10-card="1"]');p=point(1);q=point(2,8);emitTouch(e,'touchstart',[p]);const swipe=emitTouch(e,'touchmove',[q]);emitTouch(e,'touchend',[],[q]);check(!swipe.defaultPrevented&&order.join(',')==='1,2,3,4','Outside Arrange mode a prompt swipe keeps existing scrolling behavior');e.click();check(plays===1,'Outside Arrange mode a normal click still selects locally');
 reset('hf',true);e=document.querySelector('[data-cid="1"]');p=point(1);q=point(2,8);emitTouch(e,'touchstart',[p]);const hf=emitTouch(e,'touchmove',[q]);emitTouch(e,'touchend',[],[q]);check(!hf.defaultPrevented&&order.join(',')==='1,2,3,4','Hand & Foot attribute retains original quick-swipe behavior');
 document.querySelector('#summary').textContent='All SIMULATED gesture checks passed. No family state or game requests exist here.';
 }catch(error){document.querySelector('#summary').textContent='Simulation failed: '+error.message;}finally{reset();document.querySelector('#run').disabled=false;}}
document.querySelector('#run').onclick=run;document.querySelector('#reset').onclick=()=>reset('o10',document.querySelector('#mode').checked);document.querySelector('#mode').onchange=()=>reset('o10',document.querySelector('#mode').checked);reset();</script></body></html>
