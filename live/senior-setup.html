<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Your Ohana invitation</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#236d83 url('/ohana-world-scene.webp') center/cover fixed;color:#fff4d3;font:700 20px/1.4 Nunito,system-ui}button,input,select{font:inherit}button{cursor:pointer}button,a{touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b0ffff;outline-offset:4px}header{min-height:135px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}h1{font:600 clamp(32px,5vw,48px)/1.1 Fredoka,system-ui;margin:0;text-shadow:0 3px 3px #214742}h1 small{display:block;font:700 18px Nunito;margin-top:10px}main{max-width:1100px;margin:auto;padding:0 24px 190px}.table{background:none;border-radius:36% 36% 20px 20px/50px 50px 20px 20px;padding:32px 30px 28px;box-shadow:none;text-shadow:0 2px 3px #153d3c,0 0 8px #153d3c}h2{font:500 26px Fredoka;margin:18px 0 8px}.line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.line input{min-width:140px;max-width:260px}.line select{max-width:300px}input[type=text],select{border:0;border-bottom:2px solid #e7bd7b;border-radius:0;background:transparent;color:inherit;padding:8px 3px;min-height:44px;width:100%}select option{background:#25596a}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:16px 12px;margin:15px 0}.choice{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;min-height:155px;border:0;background:transparent;color:inherit;padding:4px}.choice img{height:108px;width:108px;object-fit:contain;filter:drop-shadow(0 3px 3px #16384077);opacity:.75;transition:transform .16s,filter .16s}.choice strong{font:500 20px Fredoka;text-align:center}.choice[aria-pressed=true] img{filter:drop-shadow(0 3px 4px #173e3988);opacity:1;transform:translateY(-3px)}.choice[aria-pressed=true] strong{color:#caffb9}.choice[aria-pressed=true]:after{content:'✓';position:absolute;top:5px;right:16px;color:#caffb9;font-size:27px;text-shadow:0 2px 2px #143c2a}.text-action{background:none;border:0;color:#b8faff;padding:9px;font-size:18px;min-height:44px}.rooms{display:flex;gap:12px 24px;flex-wrap:wrap}.room{display:flex;align-items:center;gap:9px;min-height:44px}.room input{width:23px;height:23px;accent-color:#acd6ba}.room:has(input:checked){color:#d6ffb8}.workstation{position:fixed;bottom:0;left:0;right:0;z-index:3;background:#70401d url('/ohana-wood.webp') center/700px auto;color:#fff4d3;padding:12px max(16px,calc((100vw - 1000px)/2));box-shadow:0 -2px 9px #2d241c80;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;text-shadow:0 2px 2px #402309}.workstation button{border:0;background:none;color:inherit;padding:9px 0;min-height:44px}.workstation .save{color:#d0ffb9;font:600 25px Fredoka}.workstation details{margin-left:auto}.workstation summary{cursor:pointer;min-height:44px;padding:9px 0}.workstation details[open]{width:100%;order:4}.reading{display:flex;flex-wrap:wrap;gap:12px}.reading label{flex:1;min-width:150px}.reading span{display:block;font-size:16px}.status{width:100%;font-size:18px;margin:0}.result{padding:18px 0}.result a{color:#caffb9;font-size:24px;text-decoration:none}.result p{margin:8px 0;font-size:18px}.result button{background:none;border:0;color:#b9faff;padding:8px 0;min-height:44px;font:500 24px Fredoka}[hidden]{display:none!important}@media(max-width:600px){header{min-height:112px}main{padding:0 10px 195px}.table{padding:25px 16px;border-radius:35% 35% 16px 16px/30px 30px 16px 16px}.choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{min-height:135px}.choice img{height:88px;width:88px}.choice strong{font-size:18px}.choice[aria-pressed=true]:after{right:1px;top:1px;font-size:23px}.workstation{gap:2px 15px}.workstation .save{font-size:22px}}
</style></head><body><header><h1>Your Ohana invitation<small id="intro">Choose what belongs in their Ohana</small></h1></header><main><form id="setup"><section class="table"><div class="line" id="existing" hidden><label for="invitation">Invitation</label><select id="invitation"></select></div><label class="line">Name <input id="name" type="text" maxlength="32" value="" required></label><h2>Games <button type="button" class="text-action" id="all">Choose all</button><button type="button" class="text-action" id="none">Clear</button></h2><div id="games" class="choices"></div><h2 id="places-heading">Around Ohana</h2><div id="places" class="choices"></div><h2 id="rooms-heading">Family rooms</h2><div id="rooms" class="rooms"></div><section id="result" class="result" hidden><a id="link" target="_blank" rel="noreferrer">Open the finished link</a><p id="result-note"></p><button type="button" id="copy">Copy link</button></section></section><footer class="workstation"><button class="save" type="submit" id="save">Save and get the link</button><a href="/" style="color:#b8faff;text-decoration:none">Ohana home</a><details><summary>⚙ Settings</summary><div class="reading"><label><span>Clue size</span><select id="text"><option value="28">Large</option><option value="32" selected>Extra large</option><option value="40">Very large</option><option value="48">Largest</option></select></label><label><span>Puzzle difficulty</span><select id="level"><option value="challenge">Adult challenge</option><option value="easy">Standard</option><option value="gentle">Gentle</option></select></label><label><span>Open first</span><select id="entry"><option value="home">Their Ohana home</option><option value="granny">Granny’s puzzles</option></select></label><label id="pause"><input id="enabled" type="checkbox" checked> Link enabled</label></div></details><p id="status" class="status" role="status"></p></footer></form></main><script>
const $=s=>document.querySelector(s),owner=location.pathname==='/invite-builder',endpoint=owner?'/api/senior/offers':'/api/invite-setup/'+location.pathname.split('/').pop();let data,selectedId='',resultLink='';const picks={games:new Set(),areas:new Set()};
async function request(path,body){const headers={'content-type':'application/json'};if(owner){const token=localStorage.getItem('ohana_token');if(!token)throw Error('Open Ohana and sign in, then choose Invitations in Settings.');headers.authorization='Bearer '+token;}const r=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not save. Try again.');return d;}
function choices(target,items,group,selected){picks[group]=new Set(selected);$(target).replaceChildren();for(const item of items){const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.group=group;b.dataset.id=item.id;b.setAttribute('aria-pressed',String(picks[group].has(item.id)));const img=document.createElement('img');img.src=item.art;img.alt='';const title=document.createElement('strong');title.textContent=item.name;b.append(img,title);b.onclick=()=>{picks[group].has(item.id)?picks[group].delete(item.id):picks[group].add(item.id);b.setAttribute('aria-pressed',String(picks[group].has(item.id)));};$(target).append(b);}}
function result(link,isSetup){resultLink=link||'';$('#result').hidden=!link;if(!link)return;$('#link').href=link;$('#link').textContent=isSetup?'Open their setup link':'Open their ready-to-play Ohana';$('#result-note').textContent=isSetup?'Send this invitation to the person who will use it.':'Send this finished link. It opens their Ohana without a sign-in. They can add it to their home screen.';}
function show(d,id){data=d;let cfg,offer;if(owner){selectedId=id||'';const invite=d.invites.find(x=>x.id===selectedId);cfg=invite?.config||{name:'',text:32,level:'challenge',entry:'home'};offer=invite?.offer||{games:[],areas:[],room_ids:d.rooms.filter(r=>r.id===1).map(r=>r.id)};$('#existing').hidden=false;$('#invitation').replaceChildren(new Option('New invitation',''),...d.invites.map(x=>new Option(x.name,x.id)));$('#invitation').value=selectedId;$('#intro').textContent='Pick what each person may receive';$('#save').textContent='Save and get invitation';$('#pause').hidden=true;result(invite?.guest_url,false);}else{cfg=d.config;offer={games:cfg.games,areas:cfg.areas|| (cfg.chat?['chat']:[]),room_ids:cfg.room_ids};$('#intro').textContent='Arrange their Ohana from the choices offered';$('#save').textContent='Save and get their link';$('#enabled').checked=d.enabled;result(d.guest_url,false);}$('#name').value=cfg.name;$('#text').value=String(cfg.text);$('#level').value=cfg.level;$('#entry').value=cfg.entry||'granny';choices('#games',d.catalog,'games',offer.games);choices('#places',d.places,'areas',offer.areas);$('#places-heading').hidden=!d.places.length;$('#rooms-heading').hidden=!d.rooms.length;$('#rooms').replaceChildren();for(const room of d.rooms){const l=document.createElement('label');l.className='room';const i=document.createElement('input');i.type='checkbox';i.name='room';i.value=room.id;i.checked=offer.room_ids.includes(room.id);l.append(i,document.createTextNode(room.name));$('#rooms').append(l);}}
$('#invitation').onchange=()=>show(data,$('#invitation').value);$('#all').onclick=()=>document.querySelectorAll('.choice').forEach(b=>{picks[b.dataset.group].add(b.dataset.id);b.setAttribute('aria-pressed','true');});$('#none').onclick=()=>document.querySelectorAll('.choice').forEach(b=>{picks[b.dataset.group].delete(b.dataset.id);b.setAttribute('aria-pressed','false');});
$('#setup').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;$('#status').textContent='Saving…';const body={name:$('#name').value,games:[...picks.games],areas:[...picks.areas],chat:picks.areas.has('chat'),room_ids:[...document.querySelectorAll('[name=room]:checked')].map(i=>Number(i.value)),text:Number($('#text').value),level:$('#level').value,entry:$('#entry').value,enabled:$('#enabled').checked};try{if(owner){if(selectedId){await request(endpoint,{...body,id:selectedId});}else{const made=await request('/api/senior/create',body);selectedId=made.id;}show(await request(endpoint),selectedId);}else show(await request(endpoint,body));$('#status').textContent='Saved. Your link is ready.';}catch(e){$('#status').textContent=e.message;}finally{$('#save').disabled=false;}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(resultLink);$('#status').textContent='Copied. Ready to send.';}catch{$('#link').textContent=resultLink;$('#status').textContent='Select and copy the link.';}};request(endpoint).then(d=>show(d)).catch(e=>$('#status').textContent=e.message);
</script></body></html>
