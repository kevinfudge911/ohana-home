<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Ohana Home</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0E3B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ocean:#0E3B47;--deep:#0A2C36;--shallow:#17505F;--sand:#F6E7C8;--sand2:#EED9AF;--coral:#FF8C69;--coral2:#E6704E;--sun:#FFD166;--leaf:#4FB286;--ink:#1B2A30;--mist:rgba(246,231,200,.72);--tile:#F8E3B3;--tile-edge:#C9A465;
--dl:#BFE3F0;--tl:#5BA9CC;--dw:#F7B7C5;--tw:#F0766A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ocean);color:var(--sand);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none}
h1,h2,h3,.disp{font-family:Fredoka,Nunito,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--coral);color:var(--ink);font-weight:800;font-family:Fredoka,sans-serif;font-size:17px;letter-spacing:.02em}
button:active{transform:translateY(1px)}
button.ghost{background:transparent;color:var(--sand);border:2px solid var(--mist);font-weight:600}
button.soft{background:var(--shallow);color:var(--sand)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea{font:inherit;width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--shallow);background:var(--deep);color:var(--sand);font-size:17px}
input::placeholder{color:rgba(246,231,200,.45)}
.hidden{display:none!important}
#app{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
header .logo{width:40px;height:40px}
header h1{font-size:26px;color:var(--sand)}
header small{display:block;font-family:Caveat,cursive;font-size:18px;color:var(--sun);line-height:1;margin-top:-2px}
main{flex:1;overflow-y:auto;padding:8px 16px 100px;-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--deep);border-top:1px solid rgba(246,231,200,.12);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;background:transparent;color:rgba(246,231,200,.55);border-radius:12px;padding:8px 4px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--sun)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--coral);color:var(--ink);font-size:11px;font-weight:800;border-radius:10px;padding:1px 6px;font-family:Nunito}

/* join */
.join{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:14px;max-width:440px;margin:0 auto;width:100%}
.join h1{font-size:44px;color:var(--sand);line-height:1}
.join .tag{font-family:Caveat,cursive;font-size:26px;color:var(--sun);margin:-6px 0 12px}
.join label{font-weight:700;font-size:14px;color:rgba(246,231,200,.75);margin-top:6px;display:block}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:44px;height:44px;padding:0;border-radius:12px;background:var(--deep);font-size:24px;border:2px solid transparent}
.avs button.sel{border-color:var(--sun);background:var(--shallow)}
.err{background:#5a2323;color:#ffd9d2;padding:10px 14px;border-radius:12px;font-weight:600}

/* games list */
.shelf{margin:16px 0 6px;font-size:20px;color:var(--sand)}
.shelf small{font-family:Nunito;font-weight:600;font-size:13px;color:rgba(246,231,200,.6);margin-left:8px}
.gcard{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:18px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(246,231,200,.08)}
.gcard .em{font-size:34px;width:48px;text-align:center}
.gcard .t{flex:1;min-width:0}
.gcard .t b{display:block;font-family:Fredoka;font-size:19px;font-weight:600}
.gcard .t span{font-size:13px;color:rgba(246,231,200,.7)}
.gcard button{padding:10px 14px;font-size:15px;white-space:nowrap}
.gcard.turn{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset}
.gcard .who{display:flex;gap:3px;font-size:18px}
.empty{color:rgba(246,231,200,.6);padding:14px 4px;font-style:italic}

/* game screen */
#game{position:fixed;inset:0;background:var(--ocean);display:flex;flex-direction:column;z-index:20;max-width:720px;margin:0 auto}
#game .top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--deep)}
#game .top h2{flex:1;font-size:20px}
#game .top button{padding:8px 12px;font-size:14px}
#game .body{flex:1;overflow:auto;padding:10px 10px 20px;position:relative}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sc{flex:1;min-width:120px;background:var(--deep);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;border:2px solid transparent}
.sc.turn{border-color:var(--sun)}
.sc .n{flex:1;font-weight:700;font-size:14px;line-height:1.1}
.sc .n small{display:block;font-weight:600;color:rgba(246,231,200,.6)}
.sc .p{font-family:Fredoka;font-size:24px;font-weight:600;color:var(--sun)}
.status{font-family:Caveat,cursive;font-size:24px;color:var(--sun);text-align:center;margin:6px 0 10px;line-height:1.1}
.status.me{color:var(--coral)}
.scrawl{position:absolute;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-size:clamp(22px,5.5vw,34px);color:rgba(246,231,200,.22);pointer-events:none;transform:rotate(-6deg);z-index:0;line-height:1.1}
.winbox{background:var(--sun);color:var(--ink);border-radius:18px;padding:14px;text-align:center;font-family:Fredoka;font-size:22px;font-weight:600;margin:10px 0}
.winbox small{display:block;font-family:Nunito;font-weight:700;font-size:14px;margin-top:4px}

/* words board */
.wb{--cs:calc((min(100vw,720px) - 20px)/15);display:grid;grid-template-columns:repeat(15,var(--cs));grid-auto-rows:var(--cs);gap:1px;background:var(--tile-edge);padding:1px;border-radius:6px;margin:0 auto;width:max-content;position:relative;z-index:1}
.wbwrap{position:relative}.wbwrap .scrawl{z-index:2;color:rgba(27,42,48,.2);font-size:clamp(18px,4.6vw,30px);font-weight:700}
.c{background:var(--sand);display:flex;align-items:center;justify-content:center;position:relative;font-family:Fredoka;font-size:calc(var(--cs)*.5);color:rgba(27,42,48,.55);font-weight:600}
.c.DL{background:var(--dl)}.c.TL{background:var(--tl);color:#fff}.c.DW{background:var(--dw)}.c.TW{background:var(--tw);color:#fff}
.c.ctr{background:var(--sun)}.c.star{background:var(--sun)}
.c.surp{background:linear-gradient(135deg,#E8D5F5,#F5D5E8);animation:shimmer 2s ease-in-out infinite}
.c.surp-found{background:linear-gradient(135deg,#D5F5E3,#F5EED5)}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.7}}
.c .bl{font-size:calc(var(--cs)*.34);letter-spacing:-.02em}
.c .t{position:absolute;inset:1px;border-radius:3px;background:var(--tile);border:1px solid var(--tile-edge);box-shadow:0 1px 0 var(--tile-edge);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.58);font-weight:600}
.c .t.new{background:#FFE9A8;border-color:var(--coral2)}
.c .t.last{background:#D8F1E4}
.c .t.blank{color:#7a6a3a;font-style:italic}
.c .t i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:calc(var(--cs)*.26);font-weight:700}
.rack{display:flex;justify-content:center;gap:6px;margin:12px 0 8px;min-height:52px}
.rack .rt{width:46px;height:52px;border-radius:8px;background:var(--tile);border:2px solid var(--tile-edge);color:var(--ink);font-family:Fredoka;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.rack .rt.sel{border-color:var(--coral2);background:#FFE9A8;transform:translateY(-6px)}
.rack .rt.swp{border-color:var(--tl);background:#dbeef6}
.rack .rt i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:12px;font-weight:700}
.rack .rt.used{opacity:.25}
.rack .rt.dragging{opacity:.4;transform:scale(.9)}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;width:46px;height:52px;border-radius:8px;background:var(--tile);border:2px solid var(--coral2);color:var(--ink);font-family:Fredoka;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
.c.drop-target{box-shadow:inset 0 0 0 3px var(--coral);background:rgba(255,140,105,.25)!important}
.preview-score{text-align:center;font-family:Fredoka;font-size:22px;font-weight:600;color:var(--sun);margin:4px 0;min-height:28px;transition:transform .15s}
.preview-score.pop{animation:scorePop .3s ease}
@keyframes scorePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* celebration overlay */
.celebration{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.cele-text{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-family:Fredoka;font-weight:700;color:var(--sun);text-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;animation:celeText 2s ease forwards;text-align:center;line-height:1.1}
@keyframes celeText{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;opacity:.9}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.acts button{padding:10px 14px;font-size:15px}
.bagn{text-align:center;font-size:13px;color:rgba(246,231,200,.6)}

/* fixed bottom game chat + score panel */
.game-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--deep);z-index:80;display:flex;flex-direction:column;max-height:45vh;border-top:2px solid rgba(246,231,200,.15)}
.game-bottom .gb-inner{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;max-height:45vh}
.gb-scores{display:flex;gap:6px;padding:8px 12px 4px;flex-shrink:0}
.gb-scores .gbs{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.gb-scores .gbs.turn{background:rgba(255,209,102,.12);border-radius:10px;padding:2px 6px;margin:-2px -6px}
.gb-scores .gbs .av{font-size:20px;flex:none}
.gb-scores .gbs .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.gb-scores .gbs .pt{font-family:Fredoka;font-size:20px;font-weight:600;color:var(--sun);flex:none}
.gb-scores .gbs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin-left:2px}
.gchat-msgs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding:8px 12px;scroll-behavior:smooth;flex:1;min-height:80px;max-height:200px}
.gchat-empty{text-align:center;color:rgba(246,231,200,.4);font-size:14px;padding:20px 0}
.gchat-msg{display:flex;align-items:flex-start;gap:6px;animation:bubbleIn .25s ease}
.gchat-msg.me{flex-direction:row-reverse}
.gchat-msg .av{font-size:20px;line-height:1;flex:none}
.gchat-msg .bub{background:var(--ocean);border-radius:12px;padding:6px 11px;font-size:16px;max-width:78%;border-bottom-left-radius:3px;line-height:1.35}
.gchat-msg.me .bub{background:var(--shallow);border-bottom-left-radius:12px;border-bottom-right-radius:3px}
.gchat-msg .bub b{font-size:12px;color:var(--sun);display:block;line-height:1;margin-bottom:1px}
.gchat-msg.emoji-only .bub{font-size:30px;background:transparent;padding:2px 4px}
@keyframes bubbleIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.gchat-input-row{display:flex;gap:5px;align-items:center;padding:5px 12px 8px;flex-shrink:0}
.gchat-input-row .reacts{display:flex;gap:3px;flex-shrink:0}
.gchat-input-row .reacts button{background:var(--ocean);padding:4px 7px;border-radius:10px;font-size:20px;min-width:0}
.gchat-input-row input{flex:1;padding:9px 12px;font-size:16px;border-radius:12px;min-width:0}
.gchat-input-row .send-btn{padding:8px 12px;font-size:16px;min-width:36px}
/* safe area for phones */
.gb-safe{height:max(4px,env(safe-area-inset-bottom));flex-shrink:0}
/* hide tab bar when in game */
body.in-game nav.tabs{display:none}
body.in-game main{padding-bottom:260px}

/* tictac */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:10px auto;position:relative;z-index:1}
.ttt button{aspect-ratio:1;font-size:56px;background:var(--sand);color:var(--ink);border-radius:18px;font-family:Fredoka;padding:0}
.ttt button.X{color:var(--coral2)}.ttt button.O{color:var(--tl)}.ttt button.win{background:var(--sun)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:10px auto;position:relative;z-index:1}
.mem button{aspect-ratio:1;font-size:40px;background:var(--shallow);border-radius:16px;padding:0;color:var(--ink)}
.mem button.up{background:var(--sand)}.mem button.done{background:var(--leaf);opacity:.8}
.mem button.back{background:var(--shallow) radial-gradient(circle at 50% 50%,rgba(255,209,102,.35) 0 8px,transparent 9px)}

/* checkers */
.chk{display:grid;grid-template-columns:repeat(8,1fr);max-width:420px;margin:10px auto;border:4px solid var(--tile-edge);border-radius:6px;overflow:hidden;position:relative;z-index:1}
.chk div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--sand)}
.chk div.d{background:#7C5A3A}
.chk div.from{box-shadow:inset 0 0 0 4px var(--sun)}
.chk div.can{box-shadow:inset 0 0 0 4px var(--leaf)}
.chk .pc{width:78%;height:78%;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:20px}
.chk .pc.r{background:#E85A4F}.chk .pc.b{background:#2B2F36}
.chk .pc.k::after{content:'♛';color:var(--sun);font-size:22px}

/* chat */
.msgs{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:8px;min-height:calc(100dvh - 250px)}
.m{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .av{font-size:26px;line-height:1}
.m .bub{background:var(--deep);border-radius:16px;padding:8px 12px;border-bottom-left-radius:4px}
.m.me .bub{background:var(--shallow);border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.m .bub b{display:block;font-size:12px;color:var(--sun);margin-bottom:2px}
.m .bub img{max-width:100%;border-radius:10px;display:block;margin-top:4px;max-height:320px}
.m .bub time{display:block;font-size:11px;color:rgba(246,231,200,.5);margin-top:3px}
.compose{position:fixed;bottom:64px;left:0;right:0;padding:8px 12px calc(6px + env(safe-area-inset-bottom));background:var(--ocean)}
.compose .in{display:flex;gap:8px;max-width:720px;margin:0 auto;align-items:flex-end}
.compose textarea{resize:none;height:48px;max-height:120px;padding:11px 14px}
.compose button{padding:0;width:48px;height:48px;font-size:22px;flex:none}
.compose button.pic{background:var(--shallow);color:var(--sand)}

/* family */
.fam{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.fam .av{font-size:30px;position:relative}
.fam .av i{position:absolute;right:-3px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#556;border:2px solid var(--deep)}
.fam .av i.on{background:var(--leaf)}
.fam b{font-family:Fredoka;font-size:18px;font-weight:600}
.fam small{display:block;color:rgba(246,231,200,.6);font-size:13px}
.admin{background:var(--deep);border-radius:18px;padding:14px;margin-top:18px}
.admin h3{font-size:18px;margin-bottom:8px}
.admin .row{display:flex;gap:8px;margin-bottom:8px}
.admin .row input{flex:1}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--sun);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* notification toggle */
.notif-row{display:flex;align-items:center;gap:10px;background:var(--deep);border-radius:16px;padding:12px 14px;margin:12px 0}
.notif-row .ntxt{flex:1}
.notif-row .ntxt b{font-family:Fredoka;font-size:16px;display:block}
.notif-row .ntxt small{color:rgba(246,231,200,.6);font-size:13px}
.sw-toggle{position:relative;width:52px;height:30px;background:var(--shallow);border-radius:15px;cursor:pointer;border:0;padding:0;transition:background .2s}
.sw-toggle.on{background:var(--leaf)}
.sw-toggle::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;background:var(--sand);border-radius:50%;transition:transform .2s}
.sw-toggle.on::after{transform:translateX(22px)}

/* invite */
.invite-card{background:var(--deep);border-radius:20px;padding:20px;text-align:center;margin:12px 0}
.invite-card .big{font-size:48px;margin-bottom:8px}
.invite-card h2{font-size:22px;margin-bottom:4px}
.invite-card .sub{font-family:Caveat,cursive;font-size:20px;color:var(--sun);margin-bottom:12px}
.invite-btn{display:inline-flex;align-items:center;gap:6px;background:var(--leaf);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:800;font-family:Fredoka;font-size:16px}
.invite-link-box{background:var(--ocean);border:2px solid var(--shallow);border-radius:12px;padding:10px;margin:8px 0;font-size:13px;word-break:break-all;color:var(--sand);user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AV = ['🙂','😎','🥰','🤠','🧢','🐶','🐱','🦊','🐸','🦄','🐢','🦋','🌺','⭐','🍕','🚀','🦖','🐬','🎸','🏈'];
const EM = { words:'🔤', tictac:'❌', memory:'🃏', checkers:'🔴' };
const LV = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10,'?':0};
const VAPID_PUBLIC = 'BD0GDGi2zMk91cWmhOB9CK9bLx8t53cJhTiLLm8TDSHycDV6b5ndcTUwRrzK5VstUuBkX34fSfYeT61r047zuwc';
let S = { token: localStorage.getItem('ohana_token'), me: null, tab: 'games', sync: null, msgs: [], lastMsg: 0, game: null, gstate: null, sel: null, placed: [], swapMode: false, swapSel: [], chkFrom: null, seenTurns: new Set(), av: localStorage.getItem('ohana_av') || '🙂', pushSub: null, seenMoveCount: {}, lastCelebratedMove: null };
const app = $('#app');

async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({ error: 'Connection hiccup' }));
  if (r.status === 401) { S.token = null; localStorage.removeItem('ohana_token'); render(); throw new Error('Please sign in again.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}

// ---------- PUSH NOTIFICATIONS ----------
async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    S.pushSub = sub;
    if (sub && S.token) {
      // Make sure server knows about this subscription
      const keys = sub.toJSON().keys;
      await api('/api/push/subscribe', { endpoint: sub.endpoint, p256dh: keys.p256dh, auth: keys.auth }).catch(() => {});
    }
  } catch(e) { /* quiet */ }
}

async function subscribePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast('Notifications not supported on this device'); return false; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications were blocked. Check your browser settings.'); return false; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
    });
    S.pushSub = sub;
    const keys = sub.toJSON().keys;
    await api('/api/push/subscribe', { endpoint: sub.endpoint, p256dh: keys.p256dh, auth: keys.auth });
    toast('Notifications are on!');
    return true;
  } catch(e) { toast(e.message || 'Could not turn on notifications'); return false; }
}

async function unsubscribePush() {
  try {
    if (S.pushSub) {
      const endpoint = S.pushSub.endpoint;
      await S.pushSub.unsubscribe();
      S.pushSub = null;
      await api('/api/push/unsubscribe', { endpoint }).catch(() => {});
    }
    toast('Notifications are off');
  } catch(e) { toast('Could not turn off notifications'); }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

// ----- Audio & Celebration System -----
const AudioSys = {
  ctx: null,
  getCtx() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} return this.ctx; },
  beep(freq, dur, vol = .3) {
    const c = this.getCtx(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  },
  tileDrop() { this.beep(600, .08, .2); setTimeout(() => this.beep(800, .06, .15), 50); },
  tilePickup() { this.beep(500, .06, .15); },
  playChime(pts) {
    // ascending notes for higher scores
    const notes = pts >= 40 ? [523,659,784,1047] : pts >= 25 ? [523,659,784] : pts >= 15 ? [523,659] : [523];
    notes.forEach((f, i) => setTimeout(() => this.beep(f, .15, .25), i * 120));
  },
  speak(text) {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.1; u.pitch = 1.1; u.volume = .8;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
};

function getTaunt(myScore, theirBest, pts, isMine) {
  const diff = myScore - theirBest;
  if (isMine) {
    // I just played
    const taunts = {
      bigPlay: ["Boom!", "Monster word!", "That's how it's done!", "On fire!"],
      nicePlay: ["Nice one!", "Solid!", "Well played!", "Ohana power!"],
      smallPlay: ["Every point counts!", "Building up!", "Steady!"],
      takingLead: ["Taking the lead!", "Watch out!", "Top of the board!"],
      catchingUp: ["Catching up!", "Here I come!", "Getting closer!"],
      fallingBehind: ["Uh oh!", "They're pulling ahead!", "Time to rally!"],
      wayBehind: ["Big hole to dig out of!", "Never give up!", "Comeback time!"]
    };
    let pool = pts >= 35 ? taunts.bigPlay : pts >= 20 ? taunts.nicePlay : taunts.smallPlay;
    if (diff > 30) pool = [...pool, ...taunts.takingLead];
    else if (diff > 0 && diff <= 10) pool = [...pool, ...taunts.catchingUp];
    else if (diff < -20) pool = [...pool, ...taunts.wayBehind];
    else if (diff < 0) pool = [...pool, ...taunts.fallingBehind];
    return pool[Math.floor(Math.random() * pool.length)];
  } else {
    // Opponent just played — react to THEIR move
    const taunts = {
      bigPlay: ["Whoa!", "Big play!", "They went off!", "Watch out!"],
      nicePlay: ["Not bad!", "Good one!", "They're warming up!"],
      smallPlay: ["Okay, okay", "They played it safe", "Your turn now!"],
      theyLead: ["They're ahead!", "Time to answer!", "Don't let them run away!"],
      iLead: ["Still in the lead!", "They're trying!", "Hold your ground!"],
      closing: ["They're closing in!", "Getting tight!", "Neck and neck!"]
    };
    let pool = pts >= 35 ? taunts.bigPlay : pts >= 20 ? taunts.nicePlay : taunts.smallPlay;
    if (diff < -20) pool = [...pool, ...taunts.theyLead];
    else if (diff > 20) pool = [...pool, ...taunts.iLead];
    else if (Math.abs(diff) <= 10) pool = [...pool, ...taunts.closing];
    return pool[Math.floor(Math.random() * pool.length)];
  }
}

function celebrate(pts, taunt) {
  const el = document.createElement('div');
  el.className = 'celebration';
  // scaled text size based on points
  const sz = Math.min(72, 28 + pts);
  el.innerHTML = `<div class="cele-text" style="font-size:${sz}px">+${pts}<br><span style="font-size:${Math.max(20, sz * .55)}px">${esc(taunt)}</span></div>`;
  // confetti particles scaled by score
  const count = Math.min(60, 8 + pts);
  const colors = ['#FFD166','#FF8C69','#4FB286','#5BA9CC','#F7B7C5','#F0766A','#BFE3F0','#E8D5F5'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `left:${Math.random()*100}%;top:-10px;background:${colors[i%colors.length]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation:confettiFall ${1.5+Math.random()*2}s ease-in ${Math.random()*.6}s forwards;border-radius:${Math.random()>.5?'50%':'2px'}`;
    el.appendChild(c);
  }
  document.body.appendChild(el);
  AudioSys.playChime(pts);
  setTimeout(() => AudioSys.speak(taunt), 400);
  setTimeout(() => el.remove(), 3500);
}

// ----- Live Score Calculator -----
function calcPreviewScore(st, placed) {
  if (!placed.length) return { total: 0, words: [] };
  const board = st.board.slice();
  const placedSet = new Set();
  for (const t of placed) {
    board[t.i] = { l: t.l, v: t.blank ? 0 : LV[t.l], blank: t.blank };
    placedSet.add(t.i);
  }
  const rows = new Set(placed.map(t => Math.floor(t.i / 15)));
  const cols = new Set(placed.map(t => t.i % 15));
  let dir;
  if (placed.length > 1) dir = rows.size === 1 ? 1 : 15;
  else {
    const hc = pCollect(board, placed[0].i, 1);
    dir = hc.length > 1 ? 1 : 15;
  }
  const main = pCollect(board, placed[0].i, dir);
  const wordsFormed = [];
  if (main.length > 1) wordsFormed.push(main);
  for (const t of placed) {
    const cross = pCollect(board, t.i, dir === 1 ? 15 : 1);
    if (cross.length > 1) wordsFormed.push(cross);
  }
  // dedupe
  const seen = new Set(); const uniq = [];
  for (const w of wordsFormed) { const k = w.join(','); if (!seen.has(k)) { seen.add(k); uniq.push(w); } }
  let total = 0; const detail = [];
  for (const w of uniq) {
    let sum = 0, mult = 1;
    for (const i of w) {
      let v = board[i].v;
      if (placedSet.has(i)) {
        const b = st.bonus[i];
        if (b === 'DL') v *= 2;
        if (b === 'TL') v *= 3;
        if (b === 'DW') mult *= 2;
        if (b === 'TW') mult *= 3;
      }
      sum += v;
    }
    total += sum * mult;
    detail.push({ word: w.map(i => board[i].l).join(''), score: sum * mult });
  }

}
function pCollect(board, i, dir) {
  const row = Math.floor(i / 15);
  const inLine = j => dir === 1 ? Math.floor(j / 15) === row : true;
  let start = i;
  while (true) { const prev = start - dir; if (prev < 0 || !inLine(prev) || !board[prev]) break; start = prev; }
  const idx = []; let j = start;
  while (j < 225 && inLine(j) && board[j]) { idx.push(j); j += dir; if (dir === 1 && j % 15 === 0) break; }
  return idx;
}

// ----- Drag & Drop System -----
let dragState = null;

function initDragDrop(st, g, myTurn, rack, rerender) {
  if (!myTurn || S.swapMode) return;
  const bd = $('#board');

  // Touch drag from rack tiles
  bd.querySelectorAll('.rt').forEach(btn => {
    const k = +btn.dataset.r;
    const usedIdx = new Set(S.placed.map(p => p.rackIdx));
    if (usedIdx.has(k)) return;

    let startX, startY, moved;

    const onStart = (x, y, e) => {
      startX = x; startY = y; moved = false;
      // resume context for audio
      if (AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
    };

    const onMove = (x, y, e) => {
      if (!moved && (Math.abs(x - startX) > 8 || Math.abs(y - startY) > 8)) {
        moved = true;
        AudioSys.tilePickup();
        btn.classList.add('dragging');
        // create ghost
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.id = 'drag-ghost';
        const l = rack[k];
        ghost.textContent = l === '?' ? '★' : l;
        document.body.appendChild(ghost);
        dragState = { rackIdx: k, l: rack[k], ghost };
      }
      if (moved && dragState) {
        dragState.ghost.style.left = x + 'px';
        dragState.ghost.style.top = y + 'px';
        // highlight drop target
        bd.querySelectorAll('.c.drop-target').forEach(c => c.classList.remove('drop-target'));
        const target = document.elementFromPoint(x, y);
        const cell = target?.closest?.('.c');
        if (cell && !st.board[+cell.dataset.i] && !S.placed.find(p => p.i === +cell.dataset.i)) {
          cell.classList.add('drop-target');
        }
      }
    };

    const onEnd = (x, y) => {
      if (moved && dragState) {
        bd.querySelectorAll('.c.drop-target').forEach(c => c.classList.remove('drop-target'));
        const ghost = document.getElementById('drag-ghost');
        if (ghost) ghost.remove();
        btn.classList.remove('dragging');

        const target = document.elementFromPoint(x, y);
        const cell = target?.closest?.('.c');
        if (cell) {
          const i = +cell.dataset.i;
          if (!st.board[i] && !S.placed.find(p => p.i === i)) {
            let l = rack[dragState.rackIdx], blank = false;
            if (l === '?') {
              const a = prompt('Blank tile! What letter?');
              if (!a || !/^[a-z]$/i.test(a.trim())) { dragState = null; return rerender(); }
              l = a.trim().toUpperCase(); blank = true;
            }
            S.placed.push({ i, l, blank, rackIdx: dragState.rackIdx });
            AudioSys.tileDrop();
          }
        }
        dragState = null;
        S.sel = null;
        rerender();
      }
      moved = false;
    };

    // Touch events
    btn.addEventListener('touchstart', e => {
      const t = e.touches[0];
      onStart(t.clientX, t.clientY, e);
    }, { passive: true });
    btn.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      onMove(t.clientX, t.clientY, e);
    }, { passive: false });
    btn.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      onEnd(t.clientX, t.clientY);
    });

    // Mouse drag too
    btn.addEventListener('mousedown', e => {
      onStart(e.clientX, e.clientY, e);
      const mm = ev => onMove(ev.clientX, ev.clientY, ev);
      const mu = ev => { onEnd(ev.clientX, ev.clientY); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
      window.addEventListener('mousemove', mm);
      window.addEventListener('mouseup', mu);
    });
  });
}

    <div class="rack">${rack.map((l, k) => `<button class="rt ${S.sel === k ? 'sel' : ''} ${usedIdx.has(k) ? 'used' : ''} ${S.swapSel.includes(k) ? 'swp' : ''}" data-r="${k}">${l === '?' ? '' : l}<i>${LV[l]}</i></button>`).join('')}</div>

      `<button id="play" ${!myTurn || !S.placed.length ? 'disabled' : ''}>Play word${preview.total ? ' (+' + preview.total + ')' : ''}</button><button class="soft" id="recall" ${!S.placed.length ? 'disabled' : ''}>Take back</button><button class="soft" id="shuf">Shuffle</button><button class="soft" id="swap" ${!myTurn || st.bag < 7 ? 'disabled' : ''}>Swap</button><button class="ghost" id="pass" ${!myTurn ? 'disabled' : ''}>Pass</button>`}</div>` : ''}
    <div class="wbwrap"><div class="scrawl" style="top:44%">Ohana means family,<br>and nobody gets left behind</div><div class="wb">${cells.join('')}</div></div>
    <div class="bagn">${st.bag} tiles in the bag${st.starFound ? ' · Ohana Star found' : ' · the Ohana Star is hidden (+20)'} · ${(st.surprises||[]).filter(i => !st.foundSurprises[i] && !st.board[i]).length} surprise squares left${st.mode === 'random' ? ' · 🎲 bonuses shuffle each turn!' : ''}</div>
    `;
  const rerender = () => renderWords(st, g, myTurn);

  // Tap-to-select (still works alongside drag)
  bd.querySelectorAll('.rt').forEach(btn => btn.onclick = () => {
    const k = +btn.dataset.r; if (usedIdx.has(k)) return;
    if (S.swapMode) { S.swapSel = S.swapSel.includes(k) ? S.swapSel.filter(x => x !== k) : [...S.swapSel, k]; return rerender(); }
    S.sel = S.sel === k ? null : k; rerender();
  });
  bd.querySelectorAll('.c').forEach(c => c.onclick = () => {
    const i = +c.dataset.i; if (st.board[i]) return;
    const pk = S.placed.findIndex(p => p.i === i);
    if (pk >= 0) { S.placed.splice(pk, 1); AudioSys.tilePickup(); return rerender(); }
    if (S.sel === null || !myTurn) return;
    let l = rack[S.sel], blank = false;
    if (l === '?') { const a = prompt('Blank tile! What letter do you want it to be?'); if (!a || !/^[a-z]$/i.test(a.trim())) return; l = a.trim().toUpperCase(); blank = true; }
    S.placed.push({ i, l, blank, rackIdx: S.sel }); S.sel = null; AudioSys.tileDrop(); rerender();
  });

  // Init drag-and-drop
  initDragDrop(st, g, myTurn, rack, rerender);

  const on = (id, fn) => { const e = $('#' + id); if (e) e.onclick = fn; };

  on('swapx', () => { S.swapMode = false; S.swapSel = []; rerender(); });
  on('swapgo', () => move({ action: 'swap', letters: S.swapSel.map(k => rack[k]) }, () => { S.swapMode = false; S.swapSel = []; }));
  on('pass', () => { if (confirm('Pass your turn?')) move({ action: 'pass' }); });
  on('play', () => move({ action: 'play', placements: S.placed.map(p => ({ i: p.i, l: p.l, blank: p.blank })) }, () => { S.placed = []; S.sel = null; }));
}
async function move(m, after) {
  try {
    const g = S.gstate; const meId = S.me?.id;
    const d = await api(`/api/game/${S.game}/move`, m);

    if (d.last && d.last.score) {
      // Get score context for taunts
      const scores = g?.state?.scores || {};
      const myScore = (scores[meId] || 0) + d.last.score;
      const others = Object.entries(scores).filter(([k]) => +k !== meId).map(([,v]) => v);
      const theirBest = others.length ? Math.max(...others) : 0;
      const taunt = getTaunt(myScore, theirBest, d.last.score, true);
      celebrate(d.last.score, taunt);
    } else if (d.over) {
      toast(d.winner === meId ? 'You won! 🎉' : d.winner === 'tie' ? 'Tie game!' : 'Game over');
    }
    await loadGame();
  }
  catch (e) { toast(e.message, 3500); }
}

  return out;
}

        <label style="font-size:13px">Family code — what everybody types to get in</label><div class="row"><input id="fc" value="${esc(info.family_code)}"><button id="fcs">Save</button></div>
        <label style="font-size:13px">Family name — shows under the title</label><div class="row"><input id="fn" value="${esc(info.family_name)}"><button id="fns">Save</button></div>
        <h3 style="margin-top:14px">Members</h3>${sy.members.filter(x => !x.is_admin).map(x => `<div class="row" style="align-items:center"><span style="flex:1">${x.avatar} ${esc(x.name)}</span><button class="soft" data-pin="${x.id}" style="padding:8px 10px;font-size:14px">Reset PIN</button><button class="ghost" data-rm="${x.id}" style="padding:8px 10px;font-size:14px">Remove</button></div>`).join('') || '<div class="empty">Just you so far.</div>'}
        <button class="ghost" id="clr" style="margin-top:8px;font-size:14px">Clear all chat messages</button>`;
      $('#fcs').onclick = async () => { try { await api('/api/admin/settings', { family_code: $('#fc').value }); localStorage.setItem('ohana_code', $('#fc').value); toast('Family code saved'); } catch (e) { toast(e.message); } };
      $('#fns').onclick = async () => { try { await api('/api/admin/settings', { family_name: $('#fn').value }); toast('Saved'); await sync(); render(); } catch (e) { toast(e.message); } };
      $('#adm').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { if (!confirm('Remove this person? They can rejoin with the family code.')) return; await api('/api/admin/remove', { id: +b.dataset.rm }); await sync(); render(); });
      $('#adm').querySelectorAll('[data-pin]').forEach(b => b.onclick = async () => { const p = prompt('New 4-number PIN for them:'); if (!p || !/^\d{4}$/.test(p)) return; await api('/api/admin/reset_pin', { id: +b.dataset.pin, pin: p }); toast('PIN reset'); });
      $('#clr').onclick = async () => { if (!confirm('Delete every chat message for everybody?')) return; await api('/api/admin/clear_chat', {}); S.msgs = []; S.lastMsg = 0; toast('Chat cleared'); };
    } catch (e) { $('#adm').textContent = e.message; }
  }
}

// ---------- SYNC LOOP ----------
async function sync() {
  if (!S.token) return;
  try {
    const d = await api('/api/sync?msgSince=' + S.lastMsg);
    S.me = d.me; const hadSync = !!S.sync; S.sync = d;
    if (d.messages.length) { const fresh = d.messages.filter(x => x.id > S.lastMsg); S.msgs = [...S.msgs, ...fresh].slice(-200); S.lastMsg = S.msgs[S.msgs.length - 1].id; if (hadSync && S.tab !== 'chat') S.unread = (S.unread || 0) + fresh.filter(x => x.member_id !== S.me.id).length; if (S.tab === 'chat' && !S.game) paintMsgs(true); }
    const turns = d.games.filter(g => g.my_turn).map(g => g.id);
    if (hadSync) for (const id of turns) if (!S.seenTurns.has(id) && id !== S.game) { toast('🎲 Your turn in ' + d.games.find(g => g.id === id).name); }
    S.seenTurns = new Set(turns);
    const sig = JSON.stringify([d.games, d.members.map(x => [x.id, x.online, x.avatar]), S.unread, d.familyName]);
    if (!S.game && sig !== S.sig && S.tab !== 'chat') render();
    S.sig = sig;
  } catch (e) { /* quiet */ }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installPrompt = e; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
// Adaptive polling: fast when both players online in a game, normal otherwise
function getPollInterval() {
  if (S.game && S.gstate?.players && S.sync?.members) {
    const allOnline = S.gstate.players.every(p => (S.sync.members || []).find(m => m.id === p)?.online);
    if (allOnline && S.gstate.status === 'playing') return 1500; // fast when both online
  }
  return 3500;
}
let pollTimer = null;
function schedulePoll() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      if (S.game) await loadGame(); else await sync();
    } catch(e) { /* never let polling die */ }
    schedulePoll();
  }, getPollInterval());
}
schedulePoll();
// Also re-poll when app comes back to foreground (phone unlock, tab switch)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    schedulePoll(); // restart fast
    if (S.game) loadGame().catch(() => {});
    else if (S.token) sync().then(() => { if (!S.game) render(); }).catch(() => {});
  }
});

// ---------- INVITE SYSTEM ----------
function getInviteCode() {
  const m = location.pathname.match(/^\/invite\/([a-f0-9]+)$/);
  return m ? m[1] : null;
}

async function renderInvite(code, errMsg) {
  try {
    const info = await fetch(`/api/invite/${code}`).then(r => r.json());
    if (info.error) { app.innerHTML = `<div class="join"><h1>Ohana Home</h1><div class="err">${esc(info.error)}</div><button onclick="location.href='/'">Go to Ohana Home</button></div>`; return; }
    if (info.status !== 'waiting') { app.innerHTML = `<div class="join"><h1>Ohana Home</h1><div class="err">This game already started. Ask for a new invite!</div><button onclick="location.href='/'">Go to Ohana Home</button></div>`; return; }
    const modeLabel = info.mode === 'random' ? ' 🎲 Random Random' : '';
    app.innerHTML = `<div class="join">
      <img src="/icon.svg" width="72" height="72" alt="">
      <h1>Ohana Home</h1>
      <div class="tag">You've been invited to play!</div>
      <div class="invite-card">
        <div class="big">${EM[info.type] || '🎲'}</div>
        <h2>${esc(info.game_name)}${modeLabel}</h2>
        <div class="sub">${esc(info.created_by)} ${info.created_by_avatar} wants to play with you!</div>
        <div style="font-size:14px;color:rgba(246,231,200,.7)">${info.player_count}/${info.max_players} players</div>
      </div>
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ''}
      <label>What should we call you?</label><input id="iname" placeholder="Your name" autocomplete="off" maxlength="24">
      <label>Pick a 4-number PIN (so only you can be you)</label><input id="ipin" placeholder="1234" inputmode="numeric" pattern="[0-9]*" maxlength="4" type="password">
      <label>Pick your face</label><div class="avs">${AV.map(a => `<button class="${a === S.av ? 'sel' : ''}" data-av="${a}">${a}</button>`).join('')}</div>
      <button id="igo" style="margin-top:10px">Join the game!</button>
      <p style="font-size:13px;color:rgba(246,231,200,.55);text-align:center;margin:4px 0 0">Been here before? Use the same name and PIN.</p>
    </div>`;
    const nm = localStorage.getItem('ohana_name'); if (nm) $('#iname').value = nm;
    app.querySelectorAll('[data-av]').forEach(b => b.onclick = () => { S.av = b.dataset.av; localStorage.setItem('ohana_av', S.av); app.querySelectorAll('[data-av]').forEach(x => x.classList.toggle('sel', x.dataset.av === S.av)); });
    $('#igo').onclick = async () => {
      try {
        $('#igo').disabled = true;
        const d = await api(`/api/invite/${code}/join`, { name: $('#iname').value, pin: $('#ipin').value, avatar: S.av });
        S.token = d.token; S.me = d.me;
        localStorage.setItem('ohana_token', d.token);
        localStorage.setItem('ohana_name', d.me.name);
        // Clear invite URL, go to main app
        history.replaceState(null, '', '/');
        await sync();
        openGame(d.game_id);
        setupPush();
      } catch (e) { renderInvite(code, e.message); }
    };
  } catch(e) { app.innerHTML = `<div class="join"><h1>Ohana Home</h1><div class="err">Could not load invite. Try again.</div><button onclick="location.href='/'">Go to Ohana Home</button></div>`; }
}

function getInviteLink(inviteCode) {
  return `${location.origin}/invite/${inviteCode}`;
}

async function shareInvite(inviteCode, gameName) {
  const link = getInviteLink(inviteCode);
  const text = `Come play ${gameName} with me on Ohana Home! Tap to join: ${link}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Ohana Home — Game Invite', text }); return; } catch(e) { /* user cancelled or not supported */ }
  }
  // Fallback: copy to clipboard
  try { await navigator.clipboard.writeText(link); toast('Invite link copied!'); } catch(e) { prompt('Copy this invite link:', link); }
}

// On load: check for invite URL
(async () => {
  const invCode = getInviteCode();
  if (invCode) {
    // If already logged in, try to join directly
    if (S.token) {
      try {
        const info = await fetch(`/api/invite/${invCode}`).then(r => r.json());
        if (info.status === 'waiting') {
          // Already a member — join the game directly
          try {
            const d = await api(`/api/invite/${invCode}/join`, { name: localStorage.getItem('ohana_name') || 'Friend', pin: '0000', avatar: S.av });
            history.replaceState(null, '', '/');
            await sync(); openGame(d.game_id); return;
          } catch(e) { /* PIN mismatch or full — show invite screen */ }
        }
      } catch(e) {}
    }
    renderInvite(invCode);
  } else {
    render(); if (S.token) { await sync(); render(); setupPush(); }
  }
})();
</script>
