<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ohana Home</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0E3B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ocean:#0E3B47;--deep:#0A2C36;--shallow:#17505F;--sand:#F6E7C8;--sand2:#EED9AF;--coral:#FF8C69;--coral2:#E6704E;--sun:#FFD166;--leaf:#4FB286;--ink:#1B2A30;--mist:rgba(246,231,200,.72);--tile:#F8E3B3;--tile-edge:#C9A465;
--dl:#BFE3F0;--tl:#5BA9CC;--dw:#F7B7C5;--tw:#F0766A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ocean);color:var(--sand);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none}
h1,h2,h3,.disp{font-family:Fredoka,Nunito,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--coral);color:var(--ink);font-weight:800;font-family:Fredoka,sans-serif;font-size:17px;letter-spacing:.02em}
button:active{transform:translateY(1px)}
button.ghost{background:transparent;color:var(--sand);border:2px solid var(--mist);font-weight:600}
button.soft{background:var(--shallow);color:var(--sand)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea{font:inherit;width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--shallow);background:var(--deep);color:var(--sand);font-size:17px}
input::placeholder{color:rgba(246,231,200,.45)}
.hidden{display:none!important}
#app{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
header .logo{width:40px;height:40px}
header h1{font-size:26px;color:var(--sand)}
header small{display:block;font-family:Caveat,cursive;font-size:18px;color:var(--sun);line-height:1;margin-top:-2px}
main{flex:1;overflow-y:auto;padding:8px 16px 100px;-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--deep);border-top:1px solid rgba(246,231,200,.12);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;background:transparent;color:rgba(246,231,200,.55);border-radius:12px;padding:8px 4px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--sun)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--coral);color:var(--ink);font-size:11px;font-weight:800;border-radius:10px;padding:1px 6px;font-family:Nunito}

/* join */
.join{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:14px;max-width:440px;margin:0 auto;width:100%}
.join h1{font-size:44px;color:var(--sand);line-height:1}
.join .tag{font-family:Caveat,cursive;font-size:26px;color:var(--sun);margin:-6px 0 12px}
.join label{font-weight:700;font-size:14px;color:rgba(246,231,200,.75);margin-top:6px;display:block}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:44px;height:44px;padding:0;border-radius:12px;background:var(--deep);font-size:24px;border:2px solid transparent}
.avs button.sel{border-color:var(--sun);background:var(--shallow)}
.err{background:#5a2323;color:#ffd9d2;padding:10px 14px;border-radius:12px;font-weight:600}

/* games list */
.shelf{margin:16px 0 6px;font-size:20px;color:var(--sand)}
.shelf small{font-family:Nunito;font-weight:600;font-size:13px;color:rgba(246,231,200,.6);margin-left:8px}
.gcard{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:18px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(246,231,200,.08)}
.gcard .em{font-size:34px;width:48px;text-align:center}
.gcard .t{flex:1;min-width:0}
.gcard .t b{display:block;font-family:Fredoka;font-size:19px;font-weight:600}
.gcard .t span{font-size:13px;color:rgba(246,231,200,.7)}
.gcard button{padding:10px 14px;font-size:15px;white-space:nowrap}
.gcard.turn{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset}
.gcard .who{display:flex;gap:3px;font-size:18px}
.empty{color:rgba(246,231,200,.6);padding:14px 4px;font-style:italic}

/* game screen */
#game{position:fixed;inset:0;background:var(--ocean);display:flex;flex-direction:column;z-index:20;max-width:720px;margin:0 auto}
#game .body{flex:1;overflow:auto;padding:6px 10px 10px;position:relative}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sc{flex:1;min-width:120px;background:var(--deep);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;border:2px solid transparent}
.sc.turn{border-color:var(--sun)}
.sc .n{flex:1;font-weight:700;font-size:14px;line-height:1.1}
.sc .n small{display:block;font-weight:600;color:rgba(246,231,200,.6)}
.sc .p{font-family:Fredoka;font-size:24px;font-weight:600;color:var(--sun)}
.status{font-family:Caveat,cursive;font-size:24px;color:var(--sun);text-align:center;margin:6px 0 10px;line-height:1.1}
.status.me{color:var(--coral)}
.scrawl{position:absolute;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-size:clamp(22px,5.5vw,34px);color:rgba(246,231,200,.22);pointer-events:none;transform:rotate(-6deg);z-index:0;line-height:1.1}
.winbox{background:var(--sun);color:var(--ink);border-radius:18px;padding:14px;text-align:center;font-family:Fredoka;font-size:22px;font-weight:600;margin:10px 0}
.winbox small{display:block;font-family:Nunito;font-weight:700;font-size:14px;margin-top:4px}

/* words board */
.wb{--cs:calc((min(100vw,720px) - 36px)/15);display:grid;grid-template-columns:repeat(15,var(--cs));grid-auto-rows:var(--cs);gap:1px;background:var(--tile-edge);padding:1px;border-radius:6px;margin:0 auto;width:max-content;position:relative;z-index:1}
.wbwrap{position:relative}.wbwrap .scrawl{z-index:2;color:rgba(27,42,48,.2);font-size:clamp(18px,4.6vw,30px);font-weight:700}
.c{background:var(--sand);display:flex;align-items:center;justify-content:center;position:relative;font-family:Fredoka;font-size:calc(var(--cs)*.5);color:rgba(27,42,48,.55);font-weight:600}
.c.DL{background:var(--dl)}.c.TL{background:var(--tl);color:#fff}.c.DW{background:var(--dw)}.c.TW{background:var(--tw);color:#fff}
.c.ctr{background:var(--sun)}.c.star{background:var(--sun)}
.c.surp{background:linear-gradient(135deg,#E8D5F5,#F5D5E8);animation:shimmer 2s ease-in-out infinite}
.c.surp-found{background:linear-gradient(135deg,#D5F5E3,#F5EED5)}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.7}}
.c .bl{font-size:calc(var(--cs)*.34);letter-spacing:-.02em}
.c .t{position:absolute;inset:1px;border-radius:3px;background:var(--tile);border:1px solid var(--tile-edge);box-shadow:0 1px 0 var(--tile-edge);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.58);font-weight:600}
.c .t.new{background:#FFE9A8;border-color:var(--coral2)}
.c .t.last{background:#D8F1E4}
.c .t.blank{color:#7a6a3a;font-style:italic}
.c .t i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:calc(var(--cs)*.26);font-weight:700}
.rack{display:flex;justify-content:center;gap:6px;margin:12px 0 8px;min-height:52px}
.rack .rt{width:46px;height:52px;border-radius:8px;background:var(--tile);border:2px solid var(--tile-edge);color:var(--ink);font-family:Fredoka;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.rack .rt.sel{border-color:var(--coral2);background:#FFE9A8;transform:translateY(-6px)}
.rack .rt.swp{border-color:var(--tl);background:#dbeef6}
.rack .rt i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:12px;font-weight:700}
.rack .rt.used{opacity:.25}
.rack .rt.dragging{opacity:.4;transform:scale(.9)}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;width:46px;height:52px;border-radius:8px;background:var(--tile);border:2px solid var(--coral2);color:var(--ink);font-family:Fredoka;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
.c.drop-target{box-shadow:inset 0 0 0 3px var(--coral);background:rgba(255,140,105,.25)!important}
.preview-score{text-align:center;font-family:Fredoka;font-size:22px;font-weight:600;color:var(--sun);margin:4px 0;min-height:28px;transition:transform .15s}
.preview-score.pop{animation:scorePop .3s ease}
@keyframes scorePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* celebration overlay */
.celebration{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.cele-text{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-family:Fredoka;font-weight:700;color:var(--sun);text-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;animation:celeText 2s ease forwards;text-align:center;line-height:1.1}
@keyframes celeText{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;opacity:.9}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.acts button{padding:10px 14px;font-size:15px}
.bagn{text-align:center;font-size:13px;color:rgba(246,231,200,.6)}

/* Game chat and score panel; final theme rules below. */
.game-bottom{background:var(--deep);z-index:80;display:flex;flex-direction:column;max-height:30vh;border-bottom:2px solid rgba(246,231,200,.15);flex-shrink:0}
.game-bottom .gb-inner{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;max-height:30vh}
.gb-scores{display:flex;gap:6px;padding:8px 12px 4px;flex-shrink:0}
.gb-scores .gbs{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.gb-scores .gbs.turn{background:rgba(255,209,102,.12);border-radius:10px;padding:2px 6px;margin:-2px -6px}
.gb-scores .gbs .av{font-size:20px;flex:none}
.gb-scores .gbs .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.gb-scores .gbs .pt{font-family:Fredoka;font-size:20px;font-weight:600;color:var(--sun);flex:none}
.gb-scores .gbs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin-left:2px}
.gchat-msgs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding:8px 12px;scroll-behavior:smooth;flex:1;min-height:80px;max-height:200px}
.gchat-empty{text-align:center;color:rgba(246,231,200,.4);font-size:14px;padding:20px 0}
.gchat-msg{display:flex;align-items:flex-start;gap:6px;animation:bubbleIn .25s ease}
.gchat-msg.me{flex-direction:row-reverse}
.gchat-msg .av{font-size:20px;line-height:1;flex:none}
.gchat-msg .bub{background:var(--ocean);border-radius:12px;padding:6px 11px;font-size:16px;max-width:78%;border-bottom-left-radius:3px;line-height:1.35}
.gchat-msg.me .bub{background:var(--shallow);border-bottom-left-radius:12px;border-bottom-right-radius:3px}
.gchat-msg .bub b{font-size:12px;color:var(--sun);display:block;line-height:1;margin-bottom:1px}
.gchat-msg.emoji-only .bub{font-size:30px;background:transparent;padding:2px 4px}
@keyframes bubbleIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.gchat-input-row{display:flex;gap:5px;align-items:center;padding:5px 12px 8px;flex-shrink:0}
.gchat-input-row .reacts{display:flex;gap:3px;flex-shrink:0}
.gchat-input-row .reacts button{background:var(--ocean);padding:4px 7px;border-radius:10px;font-size:20px;min-width:0}
.gchat-input-row input{flex:1;padding:9px 12px;font-size:16px;border-radius:12px;min-width:0}
.gchat-input-row .send-btn{padding:8px 12px;font-size:16px;min-width:36px}
/* safe area for phones */
.gb-safe{height:max(4px,env(safe-area-inset-top));flex-shrink:0}
/* hide tab bar when in game */
body.in-game nav.tabs{display:none}
body.in-game main{padding-bottom:20px}

/* tictac */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:10px auto;position:relative;z-index:1}
.ttt button{aspect-ratio:1;font-size:56px;background:var(--sand);color:var(--ink);border-radius:18px;font-family:Fredoka;padding:0}
.ttt button.X{color:var(--coral2)}.ttt button.O{color:var(--tl)}.ttt button.win{background:var(--sun)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:10px auto;position:relative;z-index:1}
.mem button{aspect-ratio:1;font-size:40px;background:var(--shallow);border-radius:16px;padding:0;color:var(--ink)}
.mem button.up{background:var(--sand)}.mem button.done{background:var(--leaf);opacity:.8}
.mem button.back{background:var(--shallow) radial-gradient(circle at 50% 50%,rgba(255,209,102,.35) 0 8px,transparent 9px)}

/* checkers */
.chk{display:grid;grid-template-columns:repeat(8,1fr);max-width:420px;margin:10px auto;border:4px solid var(--tile-edge);border-radius:6px;overflow:hidden;position:relative;z-index:1}
.chk div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--sand)}
.chk div.d{background:#7C5A3A}
.chk div.from{box-shadow:inset 0 0 0 4px var(--sun)}
.chk div.can{box-shadow:inset 0 0 0 4px var(--leaf)}
.chk .pc{width:78%;height:78%;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:20px}
.chk .pc.r{background:#E85A4F}.chk .pc.b{background:#2B2F36}
.chk .pc.k::after{content:'♛';color:var(--sun);font-size:22px}

/* chat */
.msgs{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:8px;min-height:calc(100dvh - 250px)}
.m{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .av{font-size:26px;line-height:1}
.m .bub{background:var(--deep);border-radius:16px;padding:8px 12px;border-bottom-left-radius:4px}
.m.me .bub{background:var(--shallow);border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.m .bub b{display:block;font-size:12px;color:var(--sun);margin-bottom:2px}
.m .bub img{max-width:100%;border-radius:10px;display:block;margin-top:4px;max-height:320px}
.m .bub time{display:block;font-size:11px;color:rgba(246,231,200,.5);margin-top:3px}
.compose{position:fixed;bottom:64px;left:0;right:0;padding:8px 12px calc(6px + env(safe-area-inset-bottom));background:var(--ocean)}
.compose .in{display:flex;gap:8px;max-width:720px;margin:0 auto;align-items:flex-end}
.compose textarea{resize:none;height:48px;max-height:120px;padding:11px 14px}
.compose button{padding:0;width:48px;height:48px;font-size:22px;flex:none}
.compose button.pic{background:var(--shallow);color:var(--sand)}

/* family */
.fam{display:flex;align-items:center;gap:12px;background:var(--deep);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.fam .av{font-size:30px;position:relative}
.fam .av i{position:absolute;right:-3px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#556;border:2px solid var(--deep)}
.fam .av i.on{background:var(--leaf)}
.fam b{font-family:Fredoka;font-size:18px;font-weight:600}
.fam small{display:block;color:rgba(246,231,200,.6);font-size:13px}
.admin{background:var(--deep);border-radius:18px;padding:14px;margin-top:18px}
.admin h3{font-size:18px;margin-bottom:8px}
.admin .row{display:flex;gap:8px;margin-bottom:8px}
.admin .row input{flex:1}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--sun);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* notification toggle */
.notif-row{display:flex;align-items:center;gap:10px;background:var(--deep);border-radius:16px;padding:12px 14px;margin:12px 0}
.notif-row .ntxt{flex:1}
.notif-row .ntxt b{font-family:Fredoka;font-size:16px;display:block}
.notif-row .ntxt small{color:rgba(246,231,200,.6);font-size:13px}
.sw-toggle{position:relative;width:52px;height:30px;background:var(--shallow);border-radius:15px;cursor:pointer;border:0;padding:0;transition:background .2s}
.sw-toggle.on{background:var(--leaf)}
.sw-toggle::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;background:var(--sand);border-radius:50%;transition:transform .2s}
.sw-toggle.on::after{transform:translateX(22px)}

/* invite */
.invite-card{background:var(--deep);border-radius:20px;padding:20px;text-align:center;margin:12px 0}
.invite-card .big{font-size:48px;margin-bottom:8px}
.invite-card h2{font-size:22px;margin-bottom:4px}
.invite-card .sub{font-family:Caveat,cursive;font-size:20px;color:var(--sun);margin-bottom:12px}
.invite-btn{display:inline-flex;align-items:center;gap:6px;background:var(--leaf);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:800;font-family:Fredoka;font-size:16px}
.invite-link-box{background:var(--ocean);border:2px solid var(--shallow);border-radius:12px;padding:10px;margin:8px 0;font-size:13px;word-break:break-all;color:var(--sand);user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Ohana Home: a welcoming place at the family table. */
:root{--ocean:#123e43;--deep:#0d2d31;--shallow:#24575a;--sand:#fff3db;--sand2:#ebd4aa;--coral:#efac77;--coral2:#b9653e;--sun:#f5ce87;--leaf:#89ccac;--ink:#243d3a;--tile:#ffedc6;--tile-edge:#a47a43;--dl:#a9d5df;--tl:#397f99;--dw:#e7b0a7;--tw:#af594e}
body{background:radial-gradient(ellipse at 15% 0%,#37615b 0,transparent 55%),#102e32}
#app{max-width:1000px}
header{padding:22px 26px 16px;gap:14px}header h1{font-family:Georgia,serif;font-size:30px;letter-spacing:-.8px}header small{font-family:Nunito,sans-serif;font-size:14px;margin-top:4px;color:#dfca9e}
header .logo{width:48px;height:48px}.home-mark{display:grid;place-items:center;width:50px;height:50px;color:var(--sun);border:1px solid #d6b47770;border-radius:16px;background:linear-gradient(135deg,#37635b,#173d3e);box-shadow:inset 0 1px #ffffff20,0 5px 15px #0002;flex:none}.home-mark svg{width:32px;height:32px}
main{padding:8px 24px 110px}
button{border-radius:12px;background:linear-gradient(#f5c393,#e7a372);box-shadow:inset 0 1px #ffffff65,0 3px 0 #925839,0 5px 10px #0002;min-height:44px;font-family:Nunito,sans-serif;font-weight:800;letter-spacing:0}
button.soft{background:linear-gradient(#366865,#24504f);border:1px solid #94bbb34a;box-shadow:inset 0 1px #ffffff18,0 2px 0 #071f22}
button.ghost{border:1px solid #c8d7cd65;box-shadow:none}button:disabled{box-shadow:none}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
input,textarea{background:#0c292dc9;border:1px solid #8cac9d66;box-shadow:inset 0 2px 5px #0002;border-radius:12px}input::placeholder,textarea::placeholder{color:#bbc7bd}select{min-height:44px}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHARACTERS = {
  "@eag": {name:"Eddie",file:"/buddy-eddie.webp",line:"Mike’s eagle buddy. Big wings, bigger heart."},

  "@coc": {name:"Coco",file:"/buddy-coco.webp",line:"Cozy cuddles and patient company."},
  "@fin": {name:"Finn",file:"/buddy-finn.webp",line:"Big fins. A soft heart."},
  "@ink": {name:"Inky",file:"/buddy-inky.webp",line:"Eight arms for extra encouragement."},
  "@kai": {name:"Kai",file:"/buddy-kai.webp",line:"A tiny explorer with a brave heart."},

function avatarMarkup(a){const c=CHARACTERS[a];return c?`<img class="character-avatar" src="${c.file}" alt="${c.name}" loading="lazy">`:esc(a||'🙂');}
const AV = [...Object.keys(CHARACTERS),'🙂','😎','🥰','🤠','🧢','🐶','🐱','🦊','🐸','🦄','🐢','🦋','🌺','⭐','🍕','🚀','🦖','🐬','🎸','🏈','🦉','🐼','🐨','🦁','🐯','🐵','🐧','🦜','🦩','🦦','🦥','🐙','🐳','🦈','🐝','🐞','🦎','🐲','🤖','👽','🦕','🦔','🐰','🐹','🐻','🦝','🐴','🦚'];
const BUDDY_NAMES = ['Sunny','Cool Bean','Big Heart','Trail Boss','Cap','Biscuit','Pounce','Clever Fox','Hopper','Sparkle','Honu','Flutter','Aloha','Twinkle','Pizza Pal','Zoom','Chomper','Splash','Rockstar','Touchdown','Hoot','Bamboo','Cuddles','Roary','Stripes','Bananas','Waddles','Chatter','Flamingo','Otto','Easy Breezy','Inky','Big Blue','Fin','Buzz','Lucky','Gecko','Ember','Beep','Cosmo','Stomper','Prickles','Bunny Hop','Nibbles','Honey','Bandit','Sundance','Peacock'];
function buddyName(a) { return CHARACTERS[a]?.name || BUDDY_NAMES[AV.indexOf(a)-Object.keys(CHARACTERS).length] || 'Your buddy'; }
function buddyPicker() {
  const chosen=AV.includes(S.av)?S.av:'@hon';
  const cards=arr=>arr.map(a=>`<button type="button" class="buddy-choice ${CHARACTERS[a]?'illustrated':''} ${a===chosen?'sel':''}" data-av="${a}" aria-label="Choose ${buddyName(a)}" aria-pressed="${a===chosen}"><span class="buddy-face">${avatarMarkup(a)}</span><small>${buddyName(a)}</small>${CHARACTERS[a]?'<span class="choice-check" aria-hidden="true">✓</span>':''}</button>`).join('');
  return `<div class="buddy-welcome"><span id="buddy-preview" aria-hidden="true">${avatarMarkup(chosen)}</span><div><b id="buddy-name">${buddyName(chosen)}</b><small id="buddy-line">${CHARACTERS[chosen]?.line||'Ready for a little friendly competition?'}</small></div></div><div class="character-grid">${cards(Object.keys(CHARACTERS).slice(0,6))}</div><details class="more-character-roster" ${Object.keys(CHARACTERS).indexOf(chosen)>=6?'open':''}><summary>Meet ${Object.keys(CHARACTERS).length-6} more Ohana friends <span aria-hidden="true">＋</span></summary><p>Pick the little personality that feels like you.</p><div class="character-grid">${cards(Object.keys(CHARACTERS).slice(6))}</div></details><details class="buddy-more"><summary>Classic emoji buddies <span>＋</span></summary><div class="avs">${cards(AV.filter(a=>!CHARACTERS[a]))}</div></details>`;
}
const gameArt = type => `<div class="game-art ${esc(type)}" aria-hidden="true"></div>`;
const EM = { mahjong:"🌺", words:'🔤', tictac:'❌', memory:'🃏', checkers:'🔴', handfoot:'🂡' };
const LV = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10,'?':0};
const VAPID_PUBLIC = 'BD0GDGi2zMk91cWmhOB9CK9bLx8t53cJhTiLLm8TDSHycDV6b5ndcTUwRrzK5VstUuBkX34fSfYeT61r047zuwc';
let S = { room: Number(localStorage.getItem('ohana_room'))||0, roomEpoch:0, token: localStorage.getItem('ohana_token'), me: null, tab: 'games', sync: null, msgs: [], lastMsg: 0, game: null, gstate: null, sel: null, placed: [], swapMode: false, swapSel: [], chkFrom: null, seenTurns: new Set(), av: localStorage.getItem('ohana_av') || '@hon', pushSub: null, seenMoveCount: {}, lastCelebratedMove: null };
const app = $('#app');

async function api(path, body, method, room=S.room) {
  const requestToken=S.token;
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: { 'content-type': 'application/json', 'x-ohana-room':String(room||0), ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({ error: 'Connection hiccup' }));
  if (r.status === 401) { if(requestToken&&requestToken===S.token)showSessionReconnect(); throw new Error('We couldn’t verify your connection. Your sign-in is still saved. Tap Retry.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  if(requestToken&&requestToken===S.token)document.querySelector('#session-reconnect')?.remove();
  return d;
}
function showSessionReconnect(){
 if(document.querySelector('#session-reconnect'))return;
 const bar=document.createElement('aside');bar.id='session-reconnect';bar.setAttribute('role','status');
 bar.innerHTML='<span>Your seat is saved. Let’s reconnect.</span><button class="soft" data-retry-session>Retry</button><button class="ghost" data-signin-session>Sign in another way</button>';
 document.body.append(bar);
 bar.querySelector('[data-retry-session]').onclick=async()=>{try{await sync();render();bar.remove();}catch(e){toast('Still reconnecting. Your saved sign-in has been kept.');}};
 bar.querySelector('[data-signin-session]').onclick=()=>{S.token=null;S.me=null;S.sync=null;S.game=null;localStorage.removeItem('ohana_token');bar.remove();render();};
}
function roomTheme(name,id){return /flower|rose|bloom/i.test(name||'')?'flower':id===1?'home':'private';}
function roomIcon(name,id){return roomTheme(name,id)==='flower'?'🌺':id===1?'🏡':'🌙';}
function roomTitle(name,id){const theme=roomTheme(name,id);return `<span class="room-name room-name-${theme}"><i aria-hidden="true">${roomIcon(name,id)}</i><span>${esc(name||'Your room')}</span></span>`;}
function toast(t, ms = 2600) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), ms); }
function fmtTime(ts) { const d = new Date(ts); return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function nameOf(id) { if(id===-1)return "Honu · computer"; const m = (S.sync?.members || []).find(x => x.id === id); return m ? m.name : (S.gstate?.names?.[id]?.name || 'Someone'); }
function avOf(id) { if(id===-1)return `<span class="ohana-buddy" title="Honu · computer">${avatarMarkup("@hon")}</span>`; const m = (S.sync?.members || []).find(x => x.id === id); return `<span class="ohana-buddy" title="${esc(buddyName(m ? m.avatar : S.gstate?.names?.[id]?.avatar))}">${avatarMarkup(m ? m.avatar : (S.gstate?.names?.[id]?.avatar || '🙂'))}</span>`; }

// ---------- PUSH NOTIFICATIONS ----------
function notificationControl(){return `<details class="notification-control"><summary aria-label="Notification settings">🔔 Notifications <span data-push-indicator>${S.pushReady?'On':'Off'}</span></summary><div class="notification-options"><p data-push-status></p><div><button type="button" data-push-action="enable">Enable notifications</button><button type="button" data-push-action="test">Send test</button><button type="button" class="ghost" data-push-action="off">Turn off</button></div><small>Turn alerts work separately from game voices and sound.</small></div></details>`;}
function updatePushControls(){
  const supported='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  const blocked=supported&&Notification.permission==='denied';
  document.querySelectorAll('[data-push-indicator]').forEach(e=>e.textContent=S.pushReady?'On':blocked?'Blocked':'Off');
  document.querySelectorAll('[data-push-status]').forEach(e=>e.textContent=!supported?'Open Ohana Home in Chrome or your installed app to enable notifications.':blocked?'Notifications are blocked. In your browser’s site settings, allow notifications for Ohana Home, then return here.':S.pushReady?'This device is connected. Send a test to check that an alert appears.':S.pushError||'Get an alert when it’s your turn—even when you’re outside the game. Tap Enable, then Allow.');
  document.querySelectorAll('[data-push-action="test"],[data-push-action="off"]').forEach(e=>e.disabled=!S.pushReady);
}
async function setupPush(){
  S.pushReady=false;
  if(!('serviceWorker' in navigator)||!('PushManager' in window))return;
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();S.pushSub=sub;
    if(sub&&S.token&&Notification.permission==='granted'){const keys=sub.toJSON().keys;await api('/api/push/subscribe',{endpoint:sub.endpoint,...keys});S.pushReady=true;S.pushError='';}
  }catch(e){S.pushError='Your notification connection needs attention. Tap Enable notifications to reconnect.';}
  updatePushControls();
}
async function subscribePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('Open Ohana Home in Chrome or your installed app.');return false;}
  try{
    const perm=await Notification.requestPermission();if(perm!=='granted'){updatePushControls();toast('Allow notifications in your browser’s site settings.');return false;}
    const reg=await navigator.serviceWorker.ready;
    const existing=await reg.pushManager.getSubscription();
    if(existing)await existing.unsubscribe();
    S.pushReady=false;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
    S.pushSub=sub;await api('/api/push/subscribe',{endpoint:sub.endpoint,...sub.toJSON().keys});
    S.pushReady=true;S.pushError='';updatePushControls();toast('Notifications enabled. Tap Send test to check this device.');return true;
  }catch(e){S.pushReady=false;S.pushError='Could not connect notifications. Tap Enable to retry.';updatePushControls();toast(S.pushError);return false;}
}
async function unsubscribePush(){
  try{if(S.pushSub){const endpoint=S.pushSub.endpoint;await S.pushSub.unsubscribe();S.pushSub=null;S.pushReady=false;await api('/api/push/unsubscribe',{endpoint});}updatePushControls();toast('Notifications are off on this device.');}catch(e){toast('Could not finish disconnecting notifications.');}
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-push-action]');if(!b)return;b.disabled=true;
  try{if(b.dataset.pushAction==='enable')await subscribePush();else if(b.dataset.pushAction==='off')await unsubscribePush();else{await api('/api/push/test',{endpoint:S.pushSub?.endpoint});toast('Test accepted. Check your phone’s notifications.');}}catch(error){S.pushReady=false;S.pushError=error.message;toast(error.message);}finally{b.disabled=false;updatePushControls();}
});
document.addEventListener('toggle',e=>{if(e.target.matches?.('.notification-control'))updatePushControls();},true);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

// ---------- JOIN ----------
function renderJoin(errMsg) {
  app.innerHTML = `<div class="join"><ohana-scene></ohana-scene>
    <span class="home-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15 16 5l12 10M8 13v14h16V13"/><path d="M16 23s-6-3.5-6-7c0-3 4-4 6-1 2-3 6-2 6 1 0 3.5-6 7-6 7Z"/></svg></span>
    <h1>Come on in.</h1>
    <div class="tag">Your place at the table is waiting.</div>
    ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ''}
    <label for="jcode">Family code</label><input id="jcode" placeholder="The family's secret word" autocapitalize="characters" autocomplete="off">
    <label for="jname">Your name</label><input id="jname" placeholder="What everybody calls you" autocomplete="off" maxlength="24">
    <label for="jpin">Your PIN (4 numbers, just for you)</label><input id="jpin" placeholder="1234" inputmode="numeric" pattern="[0-9]*" maxlength="4" type="password">
    <label>Choose your game buddy</label>${buddyPicker()}
    <button id="jgo" style="margin-top:10px">Come on in</button>

// ---------- GAME SCREEN ----------
async function openGame(id) { S.hfSel=[];S.hfMeldTarget=null;S.game = id; S.gstate = null; S.sel = null; S.placed = []; S.swapMode = false; S.swapSel = []; S.chkFrom = null; render(); await loadGame(); }
async function loadGame() {
  if (!S.game) return;
  // Also sync member online status in background
  sync().catch(() => {});
  try {
    const d = await api(`/api/game/${S.game}`);
    const oldState = S.gstate;
    const changed = JSON.stringify(d.names) !== JSON.stringify(oldState?.names) || JSON.stringify(d.score_review) !== JSON.stringify(oldState?.score_review) || JSON.stringify(d.state) !== JSON.stringify(oldState?.state) || d.status !== oldState?.status || d.players.length !== oldState?.players?.length;
    S.gstate = d;
    if (changed) {
      if (d.status !== 'playing') { S.placed = []; }
      // Detect turn change — alert player it's their turn now

function getTaunt(myScore, theirBest, pts, isMine) {
  const diff = myScore - theirBest;
  if (isMine) {
    // I just played
    const taunts = {
      bigPlay: ["Boom!", "Monster word!", "That's how it's done!", "On fire!"],
      nicePlay: ["Nice one!", "Solid!", "Well played!", "Ohana power!"],
      smallPlay: ["Every point counts!", "Building up!", "Steady!"],
      takingLead: ["Taking the lead!", "Watch out!", "Top of the board!"],
      catchingUp: ["Catching up!", "Here I come!", "Getting closer!"],
      fallingBehind: ["Uh oh!", "They're pulling ahead!", "Time to rally!"],
      wayBehind: ["Big hole to dig out of!", "Never give up!", "Comeback time!"]
    };
    let pool = pts >= 35 ? taunts.bigPlay : pts >= 20 ? taunts.nicePlay : taunts.smallPlay;
    if (diff > 30) pool = [...pool, ...taunts.takingLead];
    else if (diff > 0 && diff <= 10) pool = [...pool, ...taunts.catchingUp];
    else if (diff < -20) pool = [...pool, ...taunts.wayBehind];
    else if (diff < 0) pool = [...pool, ...taunts.fallingBehind];
    return pool[Math.floor(Math.random() * pool.length)];
  } else {
    // Opponent just played — react to THEIR move
    const taunts = {
      bigPlay: ["Whoa!", "Big play!", "They went off!", "Watch out!"],
      nicePlay: ["Not bad!", "Good one!", "They're warming up!"],
      smallPlay: ["Okay, okay", "They played it safe", "Your turn now!"],
      theyLead: ["They're ahead!", "Time to answer!", "Don't let them run away!"],
      iLead: ["Still in the lead!", "They're trying!", "Hold your ground!"],
      closing: ["They're closing in!", "Getting tight!", "Neck and neck!"]
    };
    let pool = pts >= 35 ? taunts.bigPlay : pts >= 20 ? taunts.nicePlay : taunts.smallPlay;
    if (diff < -20) pool = [...pool, ...taunts.theyLead];
    else if (diff > 20) pool = [...pool, ...taunts.iLead];
    else if (Math.abs(diff) <= 10) pool = [...pool, ...taunts.closing];
    return pool[Math.floor(Math.random() * pool.length)];
  }
}

// ----- Live Score Calculator -----
function calcPreviewScore(st, placed) {
  if (!placed.length) return { total: 0, words: [] };
  const board = st.board.slice();
  const placedSet = new Set();
  for (const t of placed) {
    board[t.i] = { l: t.l, v: t.blank ? 0 : LV[t.l], blank: t.blank };
    placedSet.add(t.i);
  }
  const rows = new Set(placed.map(t => Math.floor(t.i / 15)));
  const cols = new Set(placed.map(t => t.i % 15));
  let dir;
  if (placed.length > 1) dir = rows.size === 1 ? 1 : 15;
  else {
    const hc = pCollect(board, placed[0].i, 1);
    dir = hc.length > 1 ? 1 : 15;
  }
  const main = pCollect(board, placed[0].i, dir);
  const wordsFormed = [];
  if (main.length > 1) wordsFormed.push(main);
  for (const t of placed) {
    const cross = pCollect(board, t.i, dir === 1 ? 15 : 1);
    if (cross.length > 1) wordsFormed.push(cross);
  }
  // dedupe
  const seen = new Set(); const uniq = [];
  for (const w of wordsFormed) { const k = w.join(','); if (!seen.has(k)) { seen.add(k); uniq.push(w); } }
  let total = 0; const detail = [];
  for (const w of uniq) {
    let sum = 0, mult = 1;
    for (const i of w) {
      let v = board[i].v;
      if (placedSet.has(i)) {
        const b = st.bonus[i];
        if (b === 'DL') v *= 2;
        if (b === 'TL') v *= 3;
        if (b === 'DW') mult *= 2;
        if (b === 'TW') mult *= 3;
      }
      sum += v;
    }
    total += sum * mult;
    detail.push({ word: w.map(i => board[i].l).join(''), score: sum * mult });
  }
  if (placed.length === 7) total += 50;
  return { total, words: detail };
}
function pCollect(board, i, dir) {
  const row = Math.floor(i / 15);
  const inLine = j => dir === 1 ? Math.floor(j / 15) === row : true;
  let start = i;
  while (true) { const prev = start - dir; if (prev < 0 || !inLine(prev) || !board[prev]) break; start = prev; }
  const idx = []; let j = start;
  while (j < 225 && inLine(j) && board[j]) { idx.push(j); j += dir; if (dir === 1 && j % 15 === 0) break; }
  return idx;
}

  sources.forEach(el=>{

      bd.querySelectorAll('.drop-target').forEach(c=>c.classList.remove('drop-target'));

      const d=dragState;if(!d||d.source!==el||d.id!==e.pointerId)return;
      dragState=null;d.ghost?.remove();el.classList.remove('dragging');bd.querySelectorAll('.drop-target').forEach(c=>c.classList.remove('drop-target'));

function openEmojiPicker(inputId){
 const input=document.getElementById(inputId);if(!input)return;
 document.querySelector('.emoji-picker')?.close();
 const context={game:S.game,room:S.room,tab:S.tab,start:input.selectionStart??input.value.length,end:input.selectionEnd??input.value.length};
 let recent=[];try{recent=JSON.parse(localStorage.getItem('ohana_recent_emojis')||'[]');if(!Array.isArray(recent))recent=[];}catch{}
 const allowed=new Set(Object.values(EMOJI_GROUPS).flatMap(s=>s.split(' ')));recent=recent.filter(e=>allowed.has(e)).slice(0,24);
 const dialog=document.createElement('dialog');dialog.className='emoji-picker';dialog.setAttribute('aria-label','Choose an emoji');
 dialog.innerHTML=`<div class="emoji-heading"><img src="/buddy-kiko.webp" alt=""><div><h2>A little expression</h2><p>Pick one to add to your message.</p></div><button type="button" data-emoji-close aria-label="Close emoji picker">×</button></div><div class="emoji-categories" role="group" aria-label="Emoji categories"></div><div class="emoji-grid" role="group" aria-label="Emoji choices"></div>`;
 document.body.append(dialog);
 const categories=dialog.querySelector('.emoji-categories'),grid=dialog.querySelector('.emoji-grid');
 const show=name=>{categories.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===name)));const list=name==='Recent'?recent:EMOJI_GROUPS[name].split(' ');grid.replaceChildren();for(const emoji of [...new Set(list)]){const b=document.createElement('button');b.type='button';b.textContent=emoji;b.setAttribute('aria-label','Add '+emoji);b.onclick=()=>{
   const target=document.getElementById(inputId);if(!target||S.game!==context.game||S.room!==context.room||S.tab!==context.tab){dialog.close();return;}
   const max=target.maxLength>0?target.maxLength:2000;const start=Math.min(context.start,target.value.length),end=Math.min(context.end,target.value.length);
   if(target.value.length-(end-start)+emoji.length>max){toast('Your message is full. Send it or make a little room.');return;}
   target.setRangeText(emoji,start,end,'end');target.dispatchEvent(new Event('input',{bubbles:true}));
   recent=[emoji,...recent.filter(x=>x!==emoji)].slice(0,24);try{localStorage.setItem('ohana_recent_emojis',JSON.stringify(recent));}catch{}
   dialog.close();target.focus();
 };grid.append(b);}};
 for(const name of [...(recent.length?['Recent']:[]),...Object.keys(EMOJI_GROUPS)]){const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=()=>show(name);categories.append(b);}
 dialog.querySelector('[data-emoji-close]').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();dialog.showModal();show(recent.length?'Recent':'Faces');
}

function renderGameChat(st, g) {
  const bp = $('#game-bottom');
  if (!bp) return;
  const chat = st.chat || [];
  const meId = S.me.id;
  const turnId = g.players[g.turn];
  const reacts = ['👏','😂','🔥','💀','🎉','😎'];
  const isEmoji = t => /^\p{Emoji}+$/u.test(t) && t.length <= 4;
  const isOnline = p => (S.sync?.members || []).find(m => m.id === p)?.online;

  // Scores row
  const scoresHtml = g.players.map(p => {
    const isTurn = g.status === 'playing' && turnId === p;
    const pts = st.scores ? st.scores[p] : '';
    const dot = `<span class="dot" style="background:${isOnline(p) ? 'var(--leaf)' : '#556'}"></span>`;
    return `<div class="gbs ${isTurn ? 'turn' : ''}"><span class="av">${avOf(p)}</span><span class="nm">${esc(nameOf(p))}${dot}</span>${pts !== '' ? `<span class="pt">${pts}</span>` : ''}</div>`;
  }).join('');

  // Save input value before re-render
  const oldInput = bp.querySelector('#gchat-in');
  const savedVal = oldInput ? oldInput.value : '';

  // Nav row with Back + game title + Give up
  const modeLabel = g.mode === 'random' ? ' 🎲' : '';
  const meId2 = S.me.id;
  const navHtml = `<button class="soft" id="gb-back" style="padding:6px 10px;font-size:14px">‹ Back</button><h2 style="flex:1;font-size:21px;font-family:Georgia,serif;font-weight:400;margin:0">${esc(g.name)}${modeLabel}</h2>${g.status !== 'finished' && g.in_game ? `<button class="ghost" id="gb-leave" style="padding:6px 10px;font-size:13px">${g.status === 'waiting' ? (g.created_by === meId2 ? 'Cancel' : 'Leave') : 'Give up'}</button>` : ''}`;

  let gameHead = $('#game-head');
  if (!gameHead) { gameHead = document.createElement('div'); gameHead.id = 'game-head'; gameHead.className = 'game-head'; $('#game').prepend(gameHead); }
  const turnSummary=document.querySelector('#game .body .turn-greeting')||gameHead.querySelector('.turn-greeting');
  gameHead.innerHTML = navHtml;
  const voice=document.createElement('button');voice.className='ghost voice-toggle';voice.textContent=AudioSys.muted?'🔇 Voice off':'🔊 Voice on';voice.setAttribute('aria-label','Toggle game voices and sounds');voice.setAttribute('aria-pressed',String(!AudioSys.muted));
  voice.onclick=()=>setGameMuted(!AudioSys.muted);gameHead.insertBefore(voice,gameHead.lastElementChild);voice.textContent=AudioSys.muted?'🔇 Sound off':'🔊 Sound on';voice.setAttribute('aria-label',AudioSys.muted?'Unmute game sounds and voices':'Mute game sounds and voices');voice.setAttribute('aria-pressed',String(AudioSys.muted));

  if(turnSummary){gameHead.append(turnSummary);const last=st.history?.at(-1);let summary=turnSummary.querySelector('.compact-last-play');if(summary)summary.remove();if(g.type==='words'&&last&&Number.isFinite(last.score)){summary=document.createElement('span');summary.className='compact-last-play';summary.textContent=nameOf(last.p)+': '+(last.words?.map(w=>w.word).join(', ')||last.note||'Last play')+' · '+(last.score>0?'+':'')+last.score+' points';turnSummary.querySelector('div')?.append(summary);}}

  bp.innerHTML = `<div class="gb-inner"><div class="table-chat-title"><span aria-hidden="true">🌺</span><b>Around the table</b><small>A little friendly banter</small></div>
    ${!['words','handfoot'].includes(g.type) ? `<div class="gb-scores">${scoresHtml}</div>` : ''}
    <div class="gchat-msgs" id="gchat-msgs">${chat.length ? chat.slice(-25).map(m => {
      const mine = m.p === meId;
      const emojiOnly = isEmoji(m.text);
      return `<div class="gchat-msg ${mine ? 'me' : ''} ${emojiOnly ? 'emoji-only' : ''}"><span class="av">${avOf(m.p)}</span><div class="bub">${!mine ? `<b>${esc(nameOf(m.p))}</b>` : ''}${esc(m.text)}</div></div>`;
    }).join('') : '<div class="gchat-empty">Good company makes every game better. Say hello!</div>'}</div>
    <div class="gchat-input-row">
      <div class="reacts">${reacts.map(r => `<button data-react="${r}">${r}</button>`).join('')}<button type="button" id="gchat-emojis" aria-label="More chat emojis" title="More emojis">＋</button></div>
      <input id="gchat-in" aria-label="Message your family" placeholder="A little friendly banter…" maxlength="200" autocomplete="off" value="${esc(savedVal)}">
      <button class="send-btn" id="gchat-send" aria-label="Send message">➤</button>
    </div>
    <p class="table-blessing">Let all that you do be done with love. <span>1 Corinthians 16:14 NKJV</span></p><div class="gb-safe"></div>
  </div>`;

  _lastChatLen = chat.length;
  const msgsBox = $('#gchat-msgs');
  if (msgsBox) msgsBox.scrollTop = msgsBox.scrollHeight;

  // Quick reactions
  bp.querySelector('#gchat-emojis').onclick=()=>openEmojiPicker('gchat-in');
  bp.querySelectorAll('[data-react]').forEach(btn => btn.onclick = () => sendGameChat(g.id, btn.dataset.react));

  // Text send
  const sendText = () => {
    const inp = $('#gchat-in');
    const t = inp?.value?.trim();
    if (!t) return;
    inp.value = '';
    sendGameChat(g.id, t);
  };
  const sendBtn = $('#gchat-send'); if (sendBtn) sendBtn.onclick = sendText;
  const inp = $('#gchat-in');
  if (inp) inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); } };

  // Wire up nav buttons in the top panel
  const gbBack = $('#gb-back'); if (gbBack) gbBack.onclick = closeGame;
  const gbLeave = $('#gb-leave'); if (gbLeave) gbLeave.onclick = async () => { if (!confirm(g.status === 'waiting' ? 'Close this game?' : 'Give up this game?')) return; try { await api(`/api/game/${g.id}/leave`, {}); closeGame(); } catch (e) { toast(e.message); } };
}

async function sendGameChat(gameId, text) {
  try {
    await api(`/api/game/${gameId}/chat`, { text });
    AudioSys.beep(440, .06, .15);
    await loadGame();
  } catch(e) { toast(e.message); }
}

function mjArt(face){return `<svg viewBox="0 0 64 64" aria-hidden="true" fill="#315b50" stroke="#315b50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${MJ_DRAW[face]}</svg>`;}
function mjFree(tiles,t){if(t.removed)return false;const live=tiles.filter(x=>!x.removed&&x.id!==t.id);if(live.some(x=>x.z>t.z&&Math.abs(x.x-t.x)<1&&Math.abs(x.y-t.y)<1))return false;const side=dx=>live.some(x=>x.z===t.z&&x.x===t.x+dx&&Math.abs(x.y-t.y)<1);return !side(-1)||!side(1);}
function renderMahjong(st,g,myTurn){
  const live=st.tiles.filter(t=>!t.removed),free=live.filter(t=>mjFree(st.tiles,t));
  const pair=free.flatMap((a,i)=>free.slice(i+1).filter(b=>a.face===b.face).map(b=>[a,b]))[0];
  if(S.mjGame!==g.id||S.mjRevision!==st.revision){S.mjPick=null;S.mjHint=[];S.mjGame=g.id;S.mjRevision=st.revision;}
  $('#board').innerHTML=`<section class="mj-room"><div class="mj-heading"><div><small>THE LITTLE ISLAND COLLECTION</small><h3>A match made in Ohana</h3></div><span class="mj-count">${live.length/2}<small>pairs left</small></span></div><div class="mj-progress" role="progressbar" aria-valuemin="0" aria-valuemax="36" aria-valuenow="${st.pairs}" aria-label="${st.pairs} of 36 pairs collected"><i style="width:${st.pairs/36*100}%"></i></div><p class="mj-guide">Match two identical treasures. Each needs a clear top and a free left or right edge.</p><div class="mj-table" role="group" aria-label="Stacked Ohana Mahjong tiles">${live.map(t=>`<button type="button" class="mj-tile ${mjFree(st.tiles,t)?'free':'blocked'} ${S.mjPick===t.id?'picked':''} ${(S.mjHint||[]).includes(t.id)?'hinted':''}" style="--x:${t.x};--y:${t.y};--z:${t.z}" data-mj="${t.id}" aria-label="${MJ_NAMES[t.face]}, ${mjFree(st.tiles,t)?'free':'blocked'}, layer ${t.z+1}, row ${t.y+1}, column ${t.x+1}" aria-pressed="${S.mjPick===t.id}" ${!myTurn||!mjFree(st.tiles,t)?'disabled':''}>${mjArt(t.face)}<span>${MJ_NAMES[t.face]}</span></button>`).join('')}${!live.length?'<div class="mj-complete">🌺<h3>Every treasure found.</h3><p>Good games. Brighter people.</p></div>':''}</div><div class="mj-message" role="status" aria-live="polite">${!live.length?'Island complete! Start another from Your games.':!pair?'No open matches. Stir the sea for a fresh, solvable arrangement.':S.mjPick!==null?'Find another free '+MJ_NAMES[st.tiles.find(t=>t.id===S.mjPick).face]+'.':g.players.length===1?'Your little island escape. Take your time.':myTurn?'Your turn: find a pair for +10 points.':'Cheer them on. Your turn is coming.'}</div><div class="mj-tools"><button class="soft" id="mj-hint" ${!myTurn||!pair?'disabled':''}>✦ A little hint</button><button class="soft" id="mj-shuffle" ${!myTurn||!live.length?'disabled':''}>↻ Stir the sea</button></div><small class="mj-fair">10 points per pair · Hints & reshuffles are free${g.players.length>1?' · Take turns after each pair':''}</small><div class="mj-scores">${g.players.map(p=>`<span>${avOf(p)} ${esc(nameOf(p))} <b>${st.scores[p]} points</b></span>`).join('')}</div>${st.lastPair?`<div class="mj-last">${mjArt(st.lastPair.face)}<span>${esc(nameOf(st.lastPair.player))} found ${MJ_NAMES[st.lastPair.face]}<b>+10 points · ${st.pairs} pairs collected</b></span></div>`:''}</section>`;
  let busy=false;
  const send=async m=>{if(busy||S.movePending)return;busy=true;S.movePending=true;$('#board').querySelectorAll('button').forEach(b=>b.disabled=true);try{await api(`/api/game/${g.id}/move`,{...m,revision:st.revision});S.mjPick=null;await loadGame();AudioSys.beep(660,.12,.25);setTimeout(()=>AudioSys.beep(880,.15,.25),130);if(m.action==='match')announceCharacter(st.pairs===35?'win':'match',10,MJ_NAMES[st.tiles.find(t=>t.id===m.ids[0]).face]);else announceCharacter('shuffle');}catch(e){toast(e.message);await loadGame();renderGame();}finally{busy=false;S.movePending=false;}};
  $('#board').querySelectorAll('[data-mj]').forEach(b=>b.onclick=()=>{const id=+b.dataset.mj,t=st.tiles.find(t=>t.id===id);if(S.mjPick===id){S.mjPick=null;renderMahjong(st,g,myTurn);return;}if(S.mjPick!==null){const first=st.tiles.find(t=>t.id===S.mjPick);if(first.face===t.face){send({action:'match',ids:[first.id,id]});return;}toast('Different treasures. Try another '+MJ_NAMES[first.face]+'.');}S.mjPick=id;S.mjHint=[];AudioSys.beep(440,.07,.12);renderMahjong(st,g,myTurn);});
  $('#mj-hint').onclick=()=>{S.mjHint=pair.map(t=>t.id);S.mjPick=null;renderMahjong(st,g,myTurn);announceCharacter('hint',null,'the glowing '+MJ_NAMES[pair[0].face]+' pair');};
  $('#mj-shuffle').onclick=()=>send({action:'shuffle'});
}

function renderMem(st, g, myTurn) {
  const up = i => st.matched[i] || st.open.includes(i) || st.pending.includes(i);
  $('#board').innerHTML = `<div class="scrawl" style="top:45%">nobody gets left behind</div><div class="mem">${st.cards.map((c, i) => `<button class="${st.matched[i] ? 'done' : up(i) ? 'up' : 'back'}" data-i="${i}" ${up(i) || !myTurn ? 'disabled' : ''}>${up(i) ? c : ''}</button>`).join('')}</div><p style="text-align:center;font-size:14px;color:rgba(246,231,200,.7)">Find a pair and you go again.</p>`;
  $('#board').querySelectorAll('button').forEach(b => b.onclick = () => move({ i: +b.dataset.i }));
}
// ----- Checkers -----
function renderChk(st, g, myTurn) {
  const meIdx = g.players.indexOf(S.me.id); const mine = meIdx === 0 ? 'r' : 'b';
  const flip = meIdx === 1; // black sees board from their side
  const order = [...Array(64).keys()]; if (flip) order.reverse();
  const cans = S.chkFrom !== null ? chkTargets(st.board, S.chkFrom) : [];
  $('#board').innerHTML = `<div class="chk">${order.map(i => { const r = Math.floor(i / 8), c = i % 8; const pc = st.board[i]; const dark = (r + c) % 2 === 1;
    return `<div class="${dark ? 'd' : ''} ${S.chkFrom === i ? 'from' : ''} ${cans.includes(i) ? 'can' : ''}" data-i="${i}">${pc ? `<div class="pc ${pc.toLowerCase()} ${pc === pc.toUpperCase() ? 'k' : ''}"></div>` : ''}</div>`; }).join('')}</div>
    <p style="text-align:center;font-size:14px;color:rgba(246,231,200,.7)">${myTurn ? (st.mustContinue !== null ? 'Keep jumping with that piece!' : 'Tap your piece, then tap where it goes.') : ''} ${st.last ? '' : ''}</p>`;
  if (!myTurn) return;
  $('#board').querySelectorAll('.chk > div').forEach(d => d.onclick = () => {
    const i = +d.dataset.i; const pc = st.board[i];
    if (pc && pc.toLowerCase() === mine) { if (st.mustContinue !== null && st.mustContinue !== i) return toast('Keep jumping with the same piece'); S.chkFrom = S.chkFrom === i ? null : i; return renderChk(st, g, myTurn); }
    if (S.chkFrom !== null && cans.includes(i)) { const from = S.chkFrom; S.chkFrom = null; move({ from, to: i }); }
  });
}
function chkTargets(b, i) {
  const pc = b[i]; if (!pc) return []; const own = pc.toLowerCase(); const r = Math.floor(i / 8), c = i % 8; const out = [];
  const dirs = pc === 'R' || pc === 'B' ? [[-1,-1],[-1,1],[1,-1],[1,1]] : (own === 'r' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);
  for (const [dr, dc] of dirs) { const tr = r + dr, tc = c + dc; if (tr < 0 || tr > 7 || tc < 0 || tc > 7) continue; if (!b[tr * 8 + tc]) out.push(tr * 8 + tc); const jr = r + 2 * dr, jc = c + 2 * dc; if (jr < 0 || jr > 7 || jc < 0 || jc > 7) continue; const mid = b[tr * 8 + tc]; if (mid && mid.toLowerCase() !== own && !b[jr * 8 + jc]) out.push(jr * 8 + jc); }
  return out;
}

function shrink(file) {
  return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => { const max = 1000; let w = img.width, h = img.height; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); let q = .8, out; do { out = c.toDataURL('image/jpeg', q); q -= .1; } while (out.length > 850000 && q > .3); URL.revokeObjectURL(u); res(out); }; img.onerror = rej; img.src = u; });
}

// ---------- SYNC LOOP ----------
async function sync() {
  if (!S.token) return;
  try {
    const epoch=S.roomEpoch;
    const d = await api('/api/sync?msgSince=' + S.lastMsg);
    if(epoch!==S.roomEpoch)return;
    S.room=d.roomId;localStorage.setItem('ohana_room',S.room);
    S.me = d.me; const hadSync = !!S.sync; S.sync = d;
    if (d.messages.length) { const fresh = d.messages.filter(x => x.id > S.lastMsg); S.msgs = [...S.msgs, ...fresh].slice(-200); S.lastMsg = S.msgs[S.msgs.length - 1].id; if (hadSync && S.tab !== 'chat') S.unread = (S.unread || 0) + fresh.filter(x => x.member_id !== S.me.id).length; if (S.tab === 'chat' && !S.game) paintMsgs(true); }
    const allTurnGames=d.allGames||d.games;
    const turns = allTurnGames.filter(g => g.my_turn).map(g => g.id);
    if (hadSync) for (const id of turns) if (!S.seenTurns.has(id) && id !== S.game) { toast('🎲 Your turn in ' + allTurnGames.find(g => g.id === id).name); }
    S.seenTurns = new Set(turns);
    const sig = JSON.stringify([d.games, d.allGames, d.invitations, d.rooms, d.members.map(x => [x.id, x.online, x.avatar, x.name, x.about]), S.unread, d.familyName]);
    if (!S.game && sig !== S.sig && S.tab !== 'chat' && !S.avatarEditing && S.tab!=='rooms' && S.tab!=='settings') render();
    S.sig = sig;
  } catch (e) { /* quiet */ }
}

// Adaptive polling: fast when both players online in a game, normal otherwise
function getPollInterval() {
  if (S.game && S.gstate?.players && S.sync?.members) {
    const allOnline = S.gstate.players.every(p => (S.sync.members || []).find(m => m.id === p)?.online);
    if (allOnline && S.gstate.status === 'playing') return 1500; // fast when both online
  }
  return 3500;
}
let pollTimer = null;
function schedulePoll() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      if(!/^\/(?:room|invite)\//.test(location.pathname)){if (S.game) await loadGame(); else await sync();}
    } catch(e) { /* never let polling die */ }
    schedulePoll();
  }, getPollInterval());
}
schedulePoll();
// Also re-poll when app comes back to foreground (phone unlock, tab switch)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !/^\/(?:room|invite)\//.test(location.pathname)) {
    schedulePoll(); // restart fast
    if (S.game) loadGame().catch(() => {});
    else if (S.token) sync().then(() => { if (!S.game) render(); }).catch(() => {});
  }
});

function getInviteLink(inviteCode) {
  return `${location.origin}/invite/${inviteCode}`;
}

async function shareInvite(inviteCode, gameName) {
  const link = getInviteLink(inviteCode);
  const text = `Come play ${gameName} with me on Ohana Home! Tap to join: ${link}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Ohana Home — Game Invite', text }); return; } catch(e) { /* user cancelled or not supported */ }
  }
  // Fallback: copy to clipboard
  try { await navigator.clipboard.writeText(link); toast('Invite link copied!'); } catch(e) { prompt('Copy this invite link:', link); }
}

// On load: check for invite URL
(async () => {

  if(doorway){await renderRoomInvite(doorway[1]);return;}
  const invCode = getInviteCode();
  if (invCode) {
    // If already logged in, try to join directly
    if (S.token) {
      try {
        const info = await fetch(`/api/invite/${invCode}`).then(r => r.json());
        if (info.status === 'waiting') {
          // Already a member — join the game directly

        }
      } catch(e) {}

  } else {
    render(); if (S.token) { await sync(); render(); setupPush(); }
  }
})();

function hfMinMeldFE(score) {
  if (score < 0) return 15;
  if (score < 1500) return 50;

function countCanFE(melds) {

    }
  }
  return { cl, di };
}

// Preserve focused controls when polling or selection replaces their DOM nodes.
function accessWrap(fn,after){return function(...args){const old=document.activeElement,key=accessFocusKey(old),start=old?.selectionStart,end=old?.selectionEnd,result=fn.apply(this,args);after?.(...args);if(result?.then)result.then(()=>after?.(...args),()=>{});if(key&&!old.isConnected&&!document.querySelector('dialog[open]')){const next=document.querySelector(key);if(next&&!next.disabled){next.focus({preventScroll:true});if(typeof start==='number'&&next.setSelectionRange)try{next.setSelectionRange(start,end);}catch{}}else{const fallback=document.getElementById('board')||document.getElementById('main');if(fallback){fallback.tabIndex=-1;fallback.focus({preventScroll:true});}}}return result;};}
