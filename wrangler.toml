name = "ohana-home"
# Current source: unchanged Cloudflare release 3702bf24-826c-4407-b731-f2241041c4f7.
# Archived production timestamp: 2026-10-14 15:51:29 America/Chicago.
# Older root-level source is retained for history; it is not the configured entrypoint.
main = "live/worker.js"
base_dir = "live"
no_bundle = true
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Keep branch preview links (*-ohana-home.kevin-fudge911.workers.dev) switched on.
preview_urls = true

# Serve only the reviewed Bridge artwork from this same Worker.
[assets]
directory = './static-assets'


[build]
command = "node scripts/package-main-html.cjs"

[[d1_databases]]
binding = "DB"
database_name = "ohana-home"
database_id = "73a51ea8-7a23-4dea-a2ce-d2be23831a76"

[[rules]]
type = "Text"
# The main HTML is packaged losslessly as gzip and expanded by worker.js.
# Preserve the source HTML in Git without including a second uncompressed copy.
globs = ["0350a042e91c6ec3042c81d1400869ae15ba2a43-0350a042e91c6ec3042c81d1400869ae15ba2a43-0350a042e91c6ec3042c81d1400869ae15ba2a43-setup-preview.html", "09246ba466da98b180a867e23a67c4a96f3b9dbc-09246ba466da98b180a867e23a67c4a96f3b9dbc-09246ba466da98b180a867e23a67c4a96f3b9dbc-mahjong-preview.html", "1500537fb28b2cdda20f2b3b3e2f5aeef5b00a0f-1500537fb28b2cdda20f2b3b3e2f5aeef5b00a0f-1500537fb28b2cdda20f2b3b3e2f5aeef5b00a0f-buddies-preview.html", "578674b03e14cf233118aaf623cea3be759ee17c-578674b03e14cf233118aaf623cea3be759ee17c-578674b03e14cf233118aaf623cea3be759ee17c-word-error-preview.html", "6792be01ece7d11b49521a915e03c00211c8ec4c-6792be01ece7d11b49521a915e03c00211c8ec4c-6792be01ece7d11b49521a915e03c00211c8ec4c-nook-preview.html", "850bb52f5cd174bb7a67ce80538e6b3fa7387701-850bb52f5cd174bb7a67ce80538e6b3fa7387701-850bb52f5cd174bb7a67ce80538e6b3fa7387701-settings-preview.html", "910ab9c1f683637ead1416f0f2b98d8cfc4a2b4c-910ab9c1f683637ead1416f0f2b98d8cfc4a2b4c-910ab9c1f683637ead1416f0f2b98d8cfc4a2b4c-rooms-preview.html", "979fbbd59bd0b64fdcba95a94dd9029effd1c62b-979fbbd59bd0b64fdcba95a94dd9029effd1c62b-979fbbd59bd0b64fdcba95a94dd9029effd1c62b-handfoot-preview.html", "cc9d63f5e409499aae54d64850d612b9532a23bb-cc9d63f5e409499aae54d64850d612b9532a23bb-get.html", "d455966e2cbefa386f2f905a2bbb6ad4cd869617-d455966e2cbefa386f2f905a2bbb6ad4cd869617-d455966e2cbefa386f2f905a2bbb6ad4cd869617-ohana-preview.html", "eb607b960d62275db46017823e483f847d081e54-eb607b960d62275db46017823e483f847d081e54-eb607b960d62275db46017823e483f847d081e54-game-preview.html", "ohana-memories-layout-check.html", "ohana-memories.html", "ohana-o10-touch-check.html", "ohana-puzzle-deploy-check.html", "ohana-spades-bid-check.html", "ohana-words-draft-check.html", "senior-setup.html", "**/*.js.txt", "**/*.svg"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.webp", "**/*.gz", "**/ohana-announcement-menu-*-v1.jpg", "wind-chimes/audio/*.mp3"]
fallthrough = true

[[routes]]
pattern = "ohanahome.app"
custom_domain = true

# Existing production Durable Object binding; preserve its SQLite namespace.
[[durable_objects.bindings]]
name = "PUZZLE"
class_name = "PuzzleRoom"

[exports.PuzzleRoom]
type = "durable-object"
storage = "sqlite"

[[rules]]
type = "ESModule"
globs = ["**/*.js", "**/*.mjs"]
fallthrough = true

# Friendly, deduplicated reminder checks; only opted-in waiting family turns.
[triggers]
crons = ["0 * * * *"]

# Private personal-song storage; access is checked by the music API.
[[r2_buckets]]
binding = "MUSIC_FILES"
bucket_name = "ohana-music-files"

# Ohana Gathering: private family room art and PePaw's portrait. Non-public bucket; every read goes
# through the member-only Worker routes (/api/duckville/*, /api/ohana-character/*).
[[r2_buckets]]
binding = "DUCKVILLE_PRIVATE"
bucket_name = "ohana-gathering-private"

[vars]
DUCKVILLE_APPROVED_ROOM_ID = "1"
PEPAW_FAMILY_ROOM_ID = "1"
PEPAW_OWNER_MEMBER_ID = "5"

# Isolated resources for Workers Builds previews. Production bindings above are unchanged.
[previews]

[[previews.d1_databases]]
binding = "DB"
database_name = "ohana-home-preview-isolated"
database_id = "60795113-1123-4413-9572-31029bb402f4"

[[previews.r2_buckets]]
binding = "MUSIC_FILES"
bucket_name = "ohana-home-preview-isolated"

[[previews.r2_buckets]]
binding = "DUCKVILLE_PRIVATE"
bucket_name = "ohana-gathering-private"

[previews.vars]
DUCKVILLE_APPROVED_ROOM_ID = "1"
PEPAW_FAMILY_ROOM_ID = "1"
PEPAW_OWNER_MEMBER_ID = "2"
DUCKVILLE_UPLOAD_KEY = "gather-7551a7ab46c78da738a8657e"

[[previews.durable_objects.bindings]]
name = "PUZZLE"
class_name = "PuzzleRoom"
