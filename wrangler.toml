name = "ohana-home"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ohana-home"
database_id = "73a51ea8-7a23-4dea-a2ce-d2be23831a76"

[[durable_objects.bindings]]
name = "PUZZLE"
class_name = "PuzzleRoom"

[[migrations]]
tag = "v1-puzzle"
new_sqlite_classes = ["PuzzleRoom"]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.js.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.webp"]
fallthrough = true

[[routes]]
pattern = "ohanahome.app"
custom_domain = true
