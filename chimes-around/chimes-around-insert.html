<!-- OHANA CHIMES ALL AROUND START (2026-11-19 v2) -->
<style id="ohana-chimes-around-v1-css">
#oc-chimes{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden;contain:layout style}
#oc-chimes[hidden]{display:none!important}
#oc-chimes .oc-rig{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(40,22,8,.35));transition:opacity .6s ease;opacity:0}
#oc-chimes .oc-rig.oc-on{opacity:1}
</style>
<script id="ohana-chimes-around-v1">
(()=>{
if(window.ohanaChimesAround)return;
// V2 (Kevin, Nov 19): ONE chime per area, hung low in a window of the scene art where it catches wind.
// Never in the header or control panel, never over a button or words. The big cardinal chime
// ("In Memory of Daddy") stays only in the main entrance (home). The other designs are spread
// out, one per screen, room and game. Visual only: no chime sounds added anywhere.
const ENTRANCE='memorial-study';
const TABS={faith:'crystal-cascade',family:'garden-bells',rooms:'bell-quartet',settings:'crystal-duet'};
const GAMES={spades:'crystal-cascade',handfoot:'garden-bells',words:'crystal-arc',domino:'floral-trio',ohana10:'bell-quartet',flip:'crystal-trio',shuffle:'crystal-duet',mahjong:'crystal-arc',chess:'crystal-trio',checkers:'bell-quartet',tictac:'floral-trio',memory:'garden-bells'};
const SPREAD=['garden-bells','floral-trio','bell-quartet','crystal-cascade','crystal-arc','crystal-trio','crystal-duet'];
const FAMILY={'memorial-study':'p','garden-bells':'u','floral-trio':'u','bell-quartet':'u','crystal-cascade':'c','crystal-arc':'c','crystal-trio':'c','crystal-duet':'c'};
const ASPECT={p:250/1000,u:400/950,c:500/1100};
const COUNT={'memorial-study':5,'garden-bells':5,'floral-trio':3,'bell-quartet':4,'crystal-cascade':5,'crystal-arc':4,'crystal-trio':3,'crystal-duet':2};
const CLICK='button,a,input,select,textarea,label,summary,[role="button"],[role="link"],[role="tab"],[onclick],[tabindex]:not([tabindex="-1"])';
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
let mod=null,loading=null,layer=null,place='',rig=null,raf=0,lastFrame=0,gust=0,gustAt=0,nextGust=0,failed=false,spot='';
const st=()=>{try{return typeof S==='object'&&S?S:null}catch(e){return null}};
const hash=k=>{let h=7;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;return h;};
function placeKey(){
 const s=st();if(!s||!s.me)return'';
 if(document.querySelector('#om-chat:not([hidden])'))return'';
 if(s.game){const gs=s.gstate,t=String((gs&&(gs.type||gs.game&&gs.game.type))||'game');return'game:'+t;}
 const open=[...document.querySelectorAll('dialog[open]')].filter(d=>d.getClientRects().length);
 const room=open.find(d=>d.classList.contains('ohana-category-room'));
 if(open.some(d=>d!==room))return'';
 if(room)return'room:'+(room.dataset.ohanaCategory||room.getAttribute('aria-label')||'room');
 return'tab:'+(TABS[s.tab]?s.tab:'games');
}
function styleFor(key){
 if(key==='tab:games')return ENTRANCE;
 if(key.startsWith('tab:'))return TABS[key.slice(4)];
 if(key.startsWith('game:')&&GAMES[key.slice(5)])return GAMES[key.slice(5)];
 return SPREAD[hash(key)%SPREAD.length];
}
function ensureLayer(){
 if(layer&&layer.isConnected)return layer;
 layer=document.createElement('div');layer.id='oc-chimes';layer.setAttribute('aria-hidden','true');layer.inert=true;
 document.body.append(layer);return layer;
}
function load(){
 if(mod)return Promise.resolve(mod);
 if(!loading)loading=import('/wind-chimes/renderer-v6.js').then(m=>(mod=m)).catch(()=>{failed=true;return null;});
 return loading;
}
function clear(){if(rig){try{rig.view.destroy()}catch(e){}rig.el.remove();rig=null;}spot='';}
function sizeFor(style,inGame){
 const f=FAMILY[style],vh=innerHeight,vw=innerWidth;
 let h=f==='p'?Math.min(220,vh*.3):Math.min(inGame?120:160,vh*(inGame?.18:.24));
 let w=h*ASPECT[f];const maxW=Math.max(28,vw*(inGame?.09:.12));if(w>maxW){w=maxW;h=w/ASPECT[f];}
 return{w:Math.round(w),h:Math.round(h)};
}
// A point is open scene art (a window) when, looking down through the page there, we reach a big
// background before any button, any words or any picture/panel of its own.
const CLEAR=/rgba\(0, 0, 0, 0\)|transparent/;
function glyphAt(e,x,y){
 for(const n of e.childNodes){
  if(n.nodeType!==3||!n.textContent.trim())continue;
  const rg=document.createRange();rg.selectNodeContents(n);
  for(const r of rg.getClientRects())if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6)return true;
 }
 return false;
}
function openArt(x,y){
 const area=innerWidth*innerHeight;
 for(const e of document.elementsFromPoint(x,y)){
  if(e===document.documentElement||e===document.body)return true;
  if(e.matches(CLICK))return false;
  const cs=getComputedStyle(e);if(cs.cursor==='pointer')return false;
  if(glyphAt(e,x,y))return false;
  const r=e.getBoundingClientRect();if(r.width*r.height>=area*.45)return true;
  if(/^(img|svg|canvas|video|picture|iframe)$/i.test(e.tagName)||cs.backgroundImage!=='none'||!CLEAR.test(cs.backgroundColor)||parseFloat(cs.borderTopWidth)>0||cs.boxShadow!=='none')return false;
 }
 return true;
}
function fits(x,y,w,h){
 if(x<2||y<0||x+w>innerWidth-2||y+h>innerHeight-2)return false;
 for(let i=0;i<=4;i++)for(let j=0;j<=6;j++){
  if(!openArt(x+w*(.1+.8*i/4),y+h*(.04+.92*j/6)))return false;
 }
 return true;
}
function layout(){
 if(!rig)return;
 const inGame=place.startsWith('game:'),vw=innerWidth,vh=innerHeight;
 if(spot){const p=spot.split(',').map(Number);if(fits(p[0],p[1],p[2],p[3]))return;}
 const base=sizeFor(rig.style,inGame),first=hash(place)%2;
 // Hang low in a window: below the header/sign, down in the side openings of the scene.
 const ys=[.30,.36,.24,.42,.20];
 const xs=[.10,.16,.05,.22,.28];
 for(const k of[1,.82,.66]){
  const w=Math.round(base.w*k),h=Math.round(base.h*k);
  for(const sideTry of[first,1-first]){
   for(const fy of ys){
    const y=Math.round(vh*fy);
    for(const fx of xs){
     const x=sideTry===0?Math.round(vw*fx):Math.round(vw*(1-fx)-w);
     if(fits(x,y,w,h)){
      const key=[x,y,w,h].join(',');
      if(key!==spot){Object.assign(rig.el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',display:''});spot=key;}
      return;
     }
    }
   }
  }
 }
 rig.el.style.display='none';spot='';
}
function pose(t){
 const ph=rig.phase,g=gust,n=COUNT[rig.style];
 const tubes=[];for(let i=0;i<n;i++)tubes.push((.035+g*.07)*Math.sin(t*(1.25+i*.19)+ph+i*1.7));
 return{angle:(.025+g*.05)*Math.sin(t*.62+ph),tubes,striker:(.04+g*.08)*Math.sin(t*1.05+ph*1.3),sail:(.06+g*.09)*Math.sin(t*.83+ph*.7)};
}
function frame(now){
 raf=0;if(!rig||document.hidden)return;
 if(now-lastFrame>=45){
  lastFrame=now;const t=now/1000;
  if(now>nextGust){gustAt=now;nextGust=now+9000+Math.random()*14000;}
  const since=(now-gustAt)/1000;gust=since<4?Math.sin(Math.PI*since/4):0;
  try{rig.view.paint(pose(t))}catch(e){}
 }
 raf=requestAnimationFrame(frame);
}
function start(){if(!rig)return;if(reduced()){try{rig.view.paint({angle:0,tubes:[],striker:0,sail:0})}catch(e){}return;}if(!raf)raf=requestAnimationFrame(frame);}
async function apply(key){
 place=key;
 if(!key){clear();if(layer)layer.hidden=true;return;}
 const m=await load();if(!m||place!==key)return;
 const L=ensureLayer();L.hidden=true;L.style.zIndex=key.startsWith('room:')?'76':'';clear();
 const style=styleFor(key),el=document.createElement('div');el.className='oc-rig';el.dataset.style=style;el.style.display='none';L.append(el);
 try{rig={el,view:m.mountRig(el,style),style,phase:Math.random()*6.28};}catch(e){el.remove();return;}
 L.hidden=false;layout();requestAnimationFrame(()=>rig&&rig.el.classList.add('oc-on'));
 nextGust=performance.now()+1200;start();
}
function tick(){
 if(failed)return;
 const key=placeKey();
 if(key!==place)apply(key);else if(rig)layout();
 if(rig&&!raf&&!document.hidden)start();
}
setInterval(tick,1500);
addEventListener('resize',()=>{if(rig)layout();},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)start();});
window.ohanaChimesAround={refresh:tick,get place(){return place},get rigs(){return rig?[{style:rig.style,shown:rig.el.style.display!=='none',left:rig.el.style.left,top:rig.el.style.top,width:rig.el.style.width,height:rig.el.style.height}]:[]}};
setTimeout(tick,600);
})();
</script>
<!-- OHANA CHIMES ALL AROUND END -->
