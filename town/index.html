<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ohana Town</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b131c}
  #town{position:relative;width:100%;max-width:720px;margin:0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #town img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  #note{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(11,19,28,.92);color:#f4e6c8;
    font:15px/1.3 system-ui,sans-serif;padding:8px 14px;border-radius:18px;opacity:0;transition:opacity .2s;pointer-events:none}
  #note.on{opacity:1}
</style>
</head>
<body>
<div id="town"><img id="art" alt="Ohana Town"></div>
<div id="note"></div>
<script>
// Ohana Town, a section of Ohana Home. Picture and tap spots come from town.json next to this page.
// Tap spots are invisible: tapping a sign opens it. Heartville Next on his phone reads the same town.json.
(async function(){
  const town=document.getElementById('town'),art=document.getElementById('art'),note=document.getElementById('note');
  let t;
  try{t=await (await fetch('town.json',{cache:'no-cache'})).json();}catch(e){return;}
  const h=new Date().getHours();const day=h>=7&&h<18&&t.art.day;
  art.src=(day?t.art.day:t.art.night)+'?v='+t.version;
  function inside(s,x,y){
    if(s.shape==='poly'){let p=s.pts,c=false;for(let i=0,j=p.length-2;i<p.length;j=i,i+=2)
      if((p[i+1]>y)!==(p[j+1]>y)&&x<(p[j]-p[i])*(y-p[i+1])/(p[j+1]-p[i+1])+p[i])c=!c;return c;}
    const [l,tp,r,b]=s.box;if(s.shape==='rect')return x>=l&&x<=r&&y>=tp&&y<=b;
    const rx=(r-l)/2,ry=(b-tp)/2,dx=(x-(l+r)/2)/rx,dy=(y-(tp+b)/2)/ry;return dx*dx+dy*dy<=1;
  }
  function say(m){note.textContent=m;note.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>note.classList.remove('on'),1800);}
  town.addEventListener('click',e=>{
    const r=art.getBoundingClientRect();if(!r.width)return;
    const x=(e.clientX-r.left)*t.width/r.width,y=(e.clientY-r.top)*t.height/r.height;
    const s=t.spots.find(s=>inside(s,x,y));if(!s)return;
    if(s.go.web&&/^https:\/\//.test(s.go.web))window.open(s.go.web,'_blank','noopener');
    else say(s.label+' opens on the phone');
  });
})();
</script>
</body>
</html>
