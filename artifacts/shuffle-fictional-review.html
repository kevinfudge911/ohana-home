 const dialog=document.createElement('dialog');dialog.className='shuffle-catalog';dialog.setAttribute('aria-labelledby','shuffle-catalog-title');
 dialog.innerHTML='<header><h2 id="shuffle-catalog-title">Choose your next card game</h2><button type="button" data-close>Close</button></header><p>Playable here: Regular Rummy and Gin Rummy. The research catalog below is rules-only; those games cannot be started here yet. Decks, player counts and variants need their own implementation.</p><p>Deck notation: 52 = one full deck; 2x52 = two decks; +J = jokers. Smaller packs require removed ranks or an explicit suit/rank adaptation. Comma-separated choices are different variants.</p><label>Find a game <input type="search" id="shuffle-catalog-search" placeholder="Name or game family"></label><label>Deck <select id="shuffle-catalog-deck"><option value="">All standard-card configurations</option><option value="single">One full 52-card deck</option><option value="other">Multiple or reduced decks</option></select></label><p role="status" data-count></p><div class="shuffle-catalog-list"></div>';
 const paint=()=>{const q=dialog.querySelector('input').value.toLowerCase(),deck=dialog.querySelector('select').value;const records=OHANA_CARD_CATALOG.filter(r=>(r.name+' '+r.family).toLowerCase().includes(q)&&(!deck||(deck==='single')===(r.deck==='52')));dialog.querySelector('[data-count]').textContent=records.length+' rules-only games';dialog.querySelector('.shuffle-catalog-list').innerHTML=records.map(r=>`<article><h3>${esc(r.name)}</h3><p>${esc(r.family)} · ${esc(r.players)} players · ${esc(r.deck)} cards</p><p>${esc(r.note)}</p><a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer">Read rules <span class="sr-only">for ${esc(r.name)}</span></a><small>Rules only · not playable here</small></article>`).join('');};
 dialog.querySelector('input').oninput=paint;dialog.querySelector('select').onchange=paint;dialog.querySelector('[data-close]').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();document.body.append(dialog);paint();dialog.showModal();dialog.querySelector('input').focus();
}
function shuffleCardLabel(card) {const ranks={1:'Ace',11:'Jack',12:'Queen',13:'King'},suits={C:'clubs',D:'diamonds',H:'hearts',S:'spades'};return (ranks[Number(card.slice(1))]||card.slice(1))+' of '+suits[card[0]];}
function shuffleCardFace(card) {const rank={1:'A',11:'J',12:'Q',13:'K'}[Number(card.slice(1))]||card.slice(1),suit={C:'♣',D:'♦',H:'♥',S:'♠'}[card[0]];return `<b>${rank}<span>${suit}</span></b><span class="shuffle-pip" aria-hidden="true">${suit}</span><b class="shuffle-corner" aria-hidden="true">${rank}<span>${suit}</span></b>`;}
function shuffleOrderContext(g,st) {return [S.me.id,g.room_id||S.room,g.id,st.round].join(':');}
function shufflePrivateDraft(g,st) {
 const context=shuffleOrderContext(g,st),hand=Array.isArray(st.hands[S.me.id])?st.hands[S.me.id]:[];
 if(S.shuffleDraft?.context!==context){let order=[];try{order=JSON.parse(localStorage.getItem('ohana-card-order:'+context)||'[]');}catch{}S.shuffleDraft={context,order:Array.isArray(order)?order.filter(c=>typeof c==='string'):[],selected:[],groups:[]};}
 const draft=S.shuffleDraft;draft.order=[...new Set([...draft.order.filter(c=>hand.includes(c)),...hand])];draft.selected=draft.selected.filter(c=>hand.includes(c));draft.groups=draft.groups.filter(m=>m.every(c=>hand.includes(c)));return draft;
}
function saveShuffleOrder(draft) {try{localStorage.setItem('ohana-card-order:'+draft.context,JSON.stringify(draft.order));}catch{}}
function shuffleMoveCard(draft,card,direction) {const i=draft.order.indexOf(card),j=i+direction;if(i<0||j<0||j>=draft.order.length)return;[draft.order[i],draft.order[j]]=[draft.order[j],draft.order[i]];saveShuffleOrder(draft);renderGame();}
function showShuffleHelp(mode) {
 const d=document.createElement('dialog');d.className='shuffle-help';d.setAttribute('aria-labelledby','shuffle-help-title');d.innerHTML=`<h2 id="shuffle-help-title">${mode==='gin'?'Gin':'Regular'} Rummy</h2><button type="button" data-close>Close</button><p>${shuffleRulesText(mode)}</p><p>Sets are 3 or 4 equal ranks; runs are at least 3 consecutive cards of one suit. A–2–3 works; Q–K–A does not. A card cannot belong to two melds. You cannot discard a card you just took from the discard pile.</p><p>Tap cards to select. Use Left / Right with one selected card to arrange your hand, or press Alt + Left / Right on a card. Sorting happens only when you choose it. In Regular Rummy, select cards and Meld, or add them to a public meld. In Gin, you can save private groups, choose your discard, then Knock / Gin. Clear groups to use the automatic best grouping. The defender gets the best legal melds and layoffs automatically; none against Gin.</p><p>Rounds pause for review. The round winner deals the next hand with “Next hand”; after an exhausted Gin stock, the nondealer does. Reopening the game resumes the saved turn. The game choice belongs to this table; choosing another game creates a new table.</p><p>Rules: <a href="https://bicyclecards.com/how-to-play/rummy-rum" target="_blank" rel="noopener noreferrer">Bicycle: basic Rummy</a> · <a href="https://www.pagat.com/rummy/ginrummy.html" target="_blank" rel="noopener noreferrer">Pagat: Gin and scoring variants</a></p>`;d.querySelector('[data-close]').onclick=()=>d.close();d.onclose=()=>d.remove();document.body.append(d);d.showModal();
}
function renderShuffleScreen(g) {
 ensureWorldScene(g);document.body.classList.add('in-game');
 const st=g.state,own=g.in_game&&Array.isArray(st.hands[S.me.id]),active=g.status==='playing'&&g.players[g.turn]===S.me.id,draft=shufflePrivateDraft(g,st),live=active&&st.phase==='play'&&!S.movePending;
 const who=id=>g.names?.[id]?.name||nameOf(id),title=st.mode==='gin'?'Gin Rummy':'Regular Rummy',selected=draft.selected;
 const card=(c,button=false)=>button?`<button type="button" id="shuffle-card-${c}" class="shuffle-card ${/[DH]/.test(c[0])?'red':''}" data-card="${c}" aria-label="${shuffleCardLabel(c)}" aria-pressed="${selected.includes(c)}">${shuffleCardFace(c)}</button>`:`<span class="shuffle-card ${/[DH]/.test(c[0])?'red':''}" role="img" aria-label="${shuffleCardLabel(c)}">${shuffleCardFace(c)}</span>`;
 const result=st.result;
 const status=g.status==='finished'?'Match finished':st.phase==='round-end'?'Round complete':active?(st.phase==='opening'?'Take the upcard or pass.':st.phase==='draw'?'Draw one card.':st.mode==='gin'?'Choose your discard. Knock if you are ready.':'Meld, lay off, or choose your discard.'):who(g.players[g.turn])+"’s turn";
 const take=active&&!S.movePending&&['draw','opening'].includes(st.phase);
 const report=result?`<section class="shuffle-round" aria-labelledby="shuffle-round-title"><h2 id="shuffle-round-title">${result.winner===null?'No score this hand':esc(who(result.winner))+' +'+result.score}</h2><p>${esc(({gin:'Gin! No layoffs.',undercut:'Undercut.',knock:'Knock.',rummy:'Rummy! Double points.',out:'All cards played.',stock:'Two stock cards remain. Same dealer; no points.'})[result.kind]||'')}</p>${result.knockerHand?`<p>${esc(who(result.knocker))}: ${result.knockerHand.points} deadwood. ${esc(who(result.defender))}: ${result.defense.points} after ${result.defense.laid.length} layoffs.</p>`:''}${result.remaining?`<p>${g.players.map(p=>esc(who(p))+': '+result.remaining[p]+' left').join(' · ')}</p>`:''}${g.status==='playing'?`<button type="button" data-action="next" ${active?'':'disabled'}>Next hand</button><p>${active?'You can deal when everyone is ready.':esc(who(g.players[g.turn]))+' deals the next hand.'}</p>`:`<button type="button" data-replay>Play again</button>`}</section>`:'';
 const shownGroups=st.mode==='gin'&&own?(draft.groups.length?draft.groups:OhanaCardRules.bestCardHand(draft.order).melds):[];
 app.innerHTML=`<div id="game" data-game-type="shuffle"><header class="shuffle-sky"><nav aria-label="Card table navigation">${roomHomeControl('data-shuffle-home')}<button type="button" data-shuffle-back>Shuffle</button><button type="button" data-shuffle-choose>Choose game</button><button type="button" data-shuffle-help>Help</button></nav><h1>Ohana Shuffle <span>${title}</span></h1></header><main class="shuffle-table" id="gb"><p class="shuffle-meta">Hand ${st.round} · First to ${st.target} · ${g.players.length} players · One 52-card deck</p><div class="shuffle-players" aria-label="Players and scores">${g.players.map(p=>`<div ${g.players[g.turn]===p&&g.status==='playing'?'aria-current="true"':''}><strong>${esc(who(p))}</strong><b>${Number(st.scores[p])||0}</b><small>${Array.isArray(st.hands[p])?st.hands[p].length:st.hands[p]} cards${p===S.me.id?' · you':''}</small></div>`).join('')}</div><p id="shuffle-status" role="status" aria-live="polite">${esc(status)}</p>${S.gameConnectionLost?'<p role="alert">Connection lost. Reopen or refresh before playing.</p>':''}${report}<section class="shuffle-piles" aria-label="Draw piles"><button type="button" class="shuffle-stock" data-draw="stock" ${take&&st.phase!=='opening'?'':'disabled'}><span class="shuffle-back" aria-hidden="true">♣<span>OHANA</span>♦</span><strong>Draw stock</strong><small>${st.stock} cards${!st.stock&&st.mode==='rummy'?' · turn discards over':''}</small></button><button type="button" class="shuffle-discard" data-draw="discard" ${take&&st.discard&&!st.forceStock?'':'disabled'}>${st.discard?card(st.discard):'<span class="shuffle-empty">Empty</span>'}<strong>Take discard</strong><small>Top card only</small></button>${st.phase==='opening'?`<button type="button" data-action="pass" ${take?'':'disabled'}>Pass upcard</button>`:''}</section>${st.mode==='rummy'?`<section class="shuffle-melds" aria-label="Public melds">${st.melds.length?st.melds.map((m,i)=>`<div><small>${esc(who(m.owner))}’s meld</small><div class="shuffle-meld-cards">${m.cards.map(c=>card(c)).join('')}</div><button type="button" data-layoff="${i}" ${live&&selected.length?'':'disabled'}>Add selected cards</button></div>`).join(''):'<p class="shuffle-table-note">The shared melds will go here.</p>'}</section>`:''}${own?`<section class="shuffle-hand" aria-label="Your hand"><h2>Your hand</h2><div class="shuffle-rack">${draft.order.map(c=>card(c,true)).join('')}</div><p class="shuffle-selection" aria-live="polite">${selected.length} selected${selected.length===1?' · '+shuffleCardLabel(selected[0]):''}</p><nav class="shuffle-arrange" aria-label="Arrange your hand"><button type="button" data-arrange="left" ${selected.length===1?'':'disabled'}>Left</button><button type="button" data-arrange="right" ${selected.length===1?'':'disabled'}>Right</button><button type="button" data-arrange="rank">Sort rank</button><button type="button" data-arrange="suit">Sort suit</button><button type="button" data-arrange="clear">Clear selection</button></nav>${st.mode==='gin'?`<details class="shuffle-private-groups"><summary>Private melds · ${draft.groups.length?'your groups':'automatic best grouping'}</summary>${shownGroups.map(m=>`<p>${m.map(c=>esc(shuffleCardLabel(c))).join(' · ')}</p>`).join('')||'<p>No melds yet.</p>'}<button type="button" data-group ${selected.length>=3?'':'disabled'}>Save selected as private meld</button><button type="button" data-clear-groups>Use automatic grouping</button><p>Groups stay private. For knocking, select one different card to discard.</p></details>`:''}<nav class="shuffle-actions" aria-label="Play cards">${st.mode==='rummy'?`<button type="button" data-action="meld" ${live&&selected.length>=3?'':'disabled'}>Meld selected</button>`:`<button type="button" data-action="knock" ${live&&selected.length===1?'':'disabled'}>Knock / Gin</button>`}<button type="button" data-action="discard" ${live&&selected.length===1?'':'disabled'}>Discard selected</button></nav></section>`:'<p>Watching this table. Other players’ cards stay private during the hand.</p>'}${st.phase==='round-end'?`<details class="shuffle-reveal"><summary>Review revealed hands</summary>${g.players.map(p=>`<div><h3>${esc(who(p))}</h3><div class="shuffle-rack">${st.hands[p].map(c=>card(c)).join('')}</div></div>`).join('')}</details>`:''}</main></div>`;
 const root=document.getElementById('game');
 root.querySelector('[data-shuffle-home]').onclick=()=>{closeGame();goHomePorch();};root.querySelector('[data-shuffle-back]').onclick=()=>{closeGame();window.OhanaCategoryRooms?.open('shuffle');};root.querySelector('[data-shuffle-choose]').onclick=()=>showGameSetup('shuffle');root.querySelector('[data-shuffle-help]').onclick=()=>showShuffleHelp(st.mode);
 root.querySelectorAll('[data-card]').forEach(b=>{b.onclick=()=>{const c=b.dataset.card;draft.selected=selected.includes(c)?selected.filter(x=>x!==c):[...selected,c];renderGame();};b.onkeydown=e=>{if(e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();shuffleMoveCard(draft,b.dataset.card,e.key==='ArrowLeft'?-1:1);}};});
 root.querySelectorAll('[data-arrange]').forEach(b=>b.onclick=()=>{const a=b.dataset.arrange;if(a==='left'||a==='right'){shuffleMoveCard(draft,selected[0],a==='left'?-1:1);return;}if(a==='clear')draft.selected=[];else draft.order.sort(a==='rank'?(a,b)=>Number(a.slice(1))-Number(b.slice(1))||a.localeCompare(b):(a,b)=>a[0].localeCompare(b[0])||Number(a.slice(1))-Number(b.slice(1)));saveShuffleOrder(draft);renderGame();});
 root.querySelector('[data-group]')?.addEventListener('click',()=>{if(!OhanaCardRules.isCardMeld(selected))return toast('Choose a valid set or run.');if(draft.groups.some(m=>m.some(c=>selected.includes(c))))return toast('A card can belong to only one private meld.');draft.groups.push([...selected]);draft.selected=[];renderGame();});root.querySelector('[data-clear-groups]')?.addEventListener('click',()=>{draft.groups=[];renderGame();});
 const send=async m=>{if(!active||S.movePending)return;root.querySelectorAll('[data-action],[data-draw],[data-layoff]').forEach(b=>b.disabled=true);try{await move({...m,revision:st.revision},()=>{draft.selected=[];draft.groups=[];});}finally{if(S.game===g.id)renderGame();}};
 root.querySelectorAll('[data-draw]').forEach(b=>b.onclick=()=>send({action:'draw',source:b.dataset.draw}));root.querySelectorAll('[data-layoff]').forEach(b=>b.onclick=()=>send({action:'layoff',cards:[...selected],target:Number(b.dataset.layoff)}));root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send({action:b.dataset.action,cards:[...selected],card:selected[0],...(b.dataset.action==='knock'&&draft.groups.length?{groups:draft.groups}:{} )}));root.querySelector('[data-replay]')?.addEventListener('click',()=>requestRematch(g));
}

let raw,game;
function renderGame(){game.state=OhanaCardRules.shuffleView(raw,101);renderShuffleScreen(game)}
function start(mode){raw=OhanaCardRules.shuffleInit([101,202],()=>.42,mode);raw.nextTurn=0;game={id:999,type:'shuffle',mode,room_id:1,in_game:true,players:[101,202],turn:0,status:'playing',names:{101:{name:'Alex (fictional)'},202:{name:'Robin (fictional)'}}};S.shuffleDraft=null;renderGame()}
async function move(m,after){try{const res=OhanaCardRules.shuffleMove(raw,game.players,game.turn,m,()=>.42);game.turn=res.next;if(res.over)game.status='finished';after?.();renderGame()}catch(e){toast(e.message)}}
function showGameSetup(){const d=document.createElement('dialog');d.className='game-setup-room';d.innerHTML='<button data-close>Close</button>'+shuffleSetupCard(S.sync,true);d.querySelector('[data-close]').onclick=()=>d.close();d.onclick=e=>{const b=e.target.closest('[data-setup-key]');if(b){const key=b.dataset.setupKey;gameSetups.shuffle[key]=['room','players'].includes(key)?Number(b.dataset.setupValue):b.dataset.setupValue;d.close();showGameSetup()}if(e.target.closest('[data-new]')){d.close();start(gameSetups.shuffle.mode)}};d.onclose=()=>d.remove();document.body.append(d);d.showModal()}
document.getElementById('review-rummy').onclick=()=>start('rummy');document.getElementById('review-gin').onclick=()=>start('gin');document.getElementById('review-setup').onclick=()=>showGameSetup();document.getElementById('review-catalog').onclick=showShuffleCatalog;start('rummy');
</script></body></html>
