<style id="ohana-overlay-home-style">dialog .ohana-overlay-home-row{display:flex;align-items:center;justify-content:flex-start;position:sticky;top:0;z-index:20;width:100%;min-height:44px;margin-bottom:8px;pointer-events:auto}dialog .ohana-overlay-home-row .room-home-control{position:relative!important;inset:auto!important;transform:none!important;flex:0 1 220px;max-width:min(220px,100%);height:44px!important}</style><script id="ohana-overlay-navigation">(()=>{'use strict';
if(window.__ohanaOverlayNavigation)return;window.__ohanaOverlayNavigation=true;
const nativeShow=HTMLDialogElement.prototype.showModal,nativePlainShow=HTMLDialogElement.prototype.show,nativeClose=HTMLDialogElement.prototype.close;const entries=new Map();let serial=0,handling=false;
const marker=state=>state&&typeof state==='object'?state.ohanaOverlayNav:null;
function hasHome(d){return [...d.querySelectorAll('button,a')].some(e=>/^(?:←\s*)?(?:Ohana\s*)?Home$/i.test((e.getAttribute('aria-label')||e.textContent||'').trim()));}
function addHome(d){if(hasHome(d)||d.querySelector('[data-global-overlay-home]'))return;const host=document.createElement('div');host.className='ohana-overlay-home-row';host.innerHTML=roomHomeControl('data-global-overlay-home');const button=host.querySelector('button');button.addEventListener('click',()=>{handling=true;try{for(const open of [...document.querySelectorAll('dialog[open]')].reverse())open.close();goHomePorch();const prior=history.state&&typeof history.state==='object'?history.state:{};const next={...prior,ohanaScreen:true,game:null,granny:false,record:null,tab:'games'};delete next.ohanaOverlayNav;history.replaceState(next,'',location.href);}finally{handling=false;}});d.prepend(host);}
function register(d){if(!d.open||d.dataset.ohanaNavigationOpen==='true')return;addHome(d);const token='overlay-'+Date.now().toString(36)+'-'+(++serial);d.dataset.ohanaNavigationOpen='true';d.dataset.ohanaNavigationToken=token;entries.set(token,d);const prior=history.state&&typeof history.state==='object'?history.state:{};history.pushState({...prior,ohanaOverlayNav:token},'',location.href);}
HTMLDialogElement.prototype.showModal=function(...args){const wasOpen=this.open,result=nativeShow.apply(this,args);if(!wasOpen)register(this);return result;};
if(nativePlainShow)HTMLDialogElement.prototype.show=function(...args){const wasOpen=this.open,result=nativePlainShow.apply(this,args);if(!wasOpen)register(this);return result;};
HTMLDialogElement.prototype.close=function(...args){const token=this.dataset.ohanaNavigationToken,result=nativeClose.apply(this,args);this.dataset.ohanaNavigationOpen='false';if(token&&!handling&&marker(history.state)===token)queueMicrotask(()=>{if(marker(history.state)===token)history.back();});return result;};
window.addEventListener('popstate',event=>{const wanted=marker(event.state);const open=[...document.querySelectorAll('dialog[open][data-ohana-navigation-token]')];const top=open.at(-1);if(top&&top.dataset.ohanaNavigationToken!==wanted){event.stopImmediatePropagation();handling=true;try{top.close();}finally{handling=false;}return;}if(wanted){const target=entries.get(wanted);if(!target?.open||!target.isConnected){event.stopImmediatePropagation();history.back();}}},true);
document.addEventListener('cancel',event=>{if(!(event.target instanceof HTMLDialogElement)||!event.target.dataset.ohanaNavigationToken)return;event.preventDefault();event.target.close();},true);
const observer=new MutationObserver(()=>{for(const d of document.querySelectorAll('dialog[open]'))register(d);});observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['open']});for(const d of document.querySelectorAll('dialog[open]'))register(d);
})();

</script>
