<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where's Waldo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font:600 13px/1.25 Nunito,system-ui,sans-serif;color:#2a1a0c}
body.solo{background:#6b4a2b}
.room{max-width:1100px;margin:0 auto;padding:4px 6px 14px;display:grid;gap:6px}
/* Plain words only: no boxes, no frames, no panels. Everything sits on the painted world. */
/* Where's Waldo colors: red and white plain words, outlined so they read on any art. */
.who b,.ctl button,.l360 h4,.l360 .acts button{color:#d7141d!important;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff,0 1px 8px #0008}
.line,.l360 p,.p small,.empty{color:#fff!important;text-shadow:0 1px 2px #000,0 0 4px #000,0 0 8px #000c}
.who{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;margin:0}
.p{display:grid;justify-items:center;gap:1px;padding:2px 2px;border:0;background:none;cursor:pointer;font:inherit;max-width:110px}
.p img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 3px #000a)}
.p b{font:800 14px/1.1 Fredoka,Nunito,sans-serif;color:#43ff81;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p small{font:800 11px/1.15 Nunito,sans-serif;color:#fff3c6;text-shadow:0 1px 2px #000,0 0 5px #000;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font:800 13px Nunito,sans-serif;color:#fff3c6;text-shadow:0 1px 2px #000,0 0 5px #000;text-align:center;padding:4px}
.ctl{display:flex;justify-content:center;gap:4px 18px;flex-wrap:wrap}
.ctl button{border:0;background:none;padding:2px 2px;cursor:pointer;font:800 15px Fredoka,Nunito,sans-serif;color:#ffd77a}
.ctl button.go,.l360 .acts button.go{color:#fff!important;text-shadow:0 0 2px #d7141d,0 0 3px #d7141d,0 0 5px #d7141d,0 1px 8px #0008}
.map-wrap{position:relative;width:100%;max-width:980px;margin:0 auto;aspect-ratio:16/10;min-height:300px;
 -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%)}
#map{position:absolute;inset:0;background:transparent}
#map .leaflet-tile-pane{filter:sepia(.3) saturate(1.3) hue-rotate(-6deg) contrast(1.05)}
.leaflet-container{background:transparent!important}
.leaflet-control-attribution{background:none!important;color:#fff3c6!important;text-shadow:0 1px 2px #000;font-size:9px!important}
.leaflet-control-attribution a{color:#fff3c6!important}
.pm{background:none;border:0}
.pm img{display:block;margin:0 auto;object-fit:contain;filter:drop-shadow(0 3px 3px #000a)}
.pm span{display:block;width:max-content;margin:0 auto;font:800 12px/1.2 Fredoka,Nunito,sans-serif;color:#d7141d;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff,0 1px 8px #0008}
.pm.old{opacity:.55}
.leaflet-popup-content{margin:8px 10px;font:600 12px/1.35 Nunito,sans-serif}
.leaflet-popup-content b{font:800 13px Fredoka,Nunito,sans-serif}
.line{text-align:center;font:800 12px/1.3 Nunito,sans-serif;color:#fff3c6;min-height:16px}
.line.note{color:#d7141d!important;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff,0 1px 8px #0008}
.l360{display:none;max-width:520px;margin:0 auto;text-align:center;color:#fff3c6;font:800 12px/1.4 Nunito,sans-serif}
.l360.on{display:block}
.l360 h4{margin:0;font:800 16px Fredoka,Nunito,sans-serif;color:#ffd77a}
.l360 p{margin:2px 0}
.l360 input{width:min(100%,360px);margin:5px auto 2px;display:block;padding:6px 10px;border-radius:10px;border:1px solid #e7b567;background:#fff8e6ee;font:700 12px Nunito,sans-serif;color:#2a1a0c;text-shadow:none}
.l360 .acts{display:flex;justify-content:center;gap:18px}
.l360 .acts button{border:0;background:none;cursor:pointer;font:800 15px Fredoka,Nunito,sans-serif;color:#ffd77a;padding:2px}

</style>
</head>
<body>
<div class="room">
  <div class="who" id="who"></div>
  <div class="ctl"><button id="all">Everyone</button><button id="l360">Life360</button><button id="share">Share: off</button></div>
  <div class="map-wrap"><div id="map"></div></div>
  <div class="l360" id="lp">
    <h4>Your Life360</h4>
    <p>It shows your people, and only you see them here. Everyone connects their own.</p>
    <p>On a computer, sign in at life360.com, press F12, open Application, then Cookies, then life360.com, and copy the access_token.</p>
    <input id="lk" type="text" autocomplete="off" spellcheck="false" placeholder="Paste your Life360 key">
    <p id="ls"></p>
    <div class="acts"><button class="go" id="lsave">Connect</button><button id="loff">Turn off</button><button id="lclose">Close</button></div>
  </div>
  <div class="line" id="line">You see family who turn Share on, plus your own Life360 people.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var DEMO = /[?&]demo=1/.test(location.search);
  if (window.parent === window) document.body.classList.add("solo");
  var tok = ""; try { tok = localStorage.getItem("ohana_token") || ""; } catch (e) {}
  var map = L.map("map", { zoomControl: false, attributionControl: true, zoomSnap: 0.5 }).setView([37.2, -93.3], 7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
  var markers = {}, last = [], fitted = false, sharing = false, watchId = null, lastSent = 0, admin = false, l360 = { connected: false };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function artUrl(a){ return !a ? "" : a.charAt(0) === "/" ? a : "/people/art/" + a; }
  function ago(iso){ var m = Math.round((Date.now() - Date.parse(iso)) / 60000); if (!isFinite(m)) return ""; if (m < 1) return "just now"; if (m < 60) return m + " min ago"; var h = Math.round(m / 60); if (h < 24) return h + " hr ago"; return Math.round(h / 24) + " days ago"; }
  function sub(p){ return p.label ? p.label : ago(p.at); }
  function icon(p){
    var w = p.kind === "vehicle" ? 56 : p.kind === "place" ? 36 : 36, h = p.kind === "vehicle" ? 34 : p.kind === "place" ? 32 : 40;
    if (!p.art) { w = 28; h = 31; }
    var inner = '<img src="' + esc(artUrl(p.art || "person.svg")) + '" alt="" style="width:' + w + 'px;height:' + h + 'px">';
    var W = Math.max(w, 64);
    return L.divIcon({ className: "pm" + (Date.now() - Date.parse(p.at) > 2 * 3600e3 ? " old" : ""), html: inner + "<span>" + esc(p.name) + "</span>", iconSize: [W, h + 16], iconAnchor: [W / 2, h] });
  }
  function fitAll(){
    if (!last.length) return;
    if (last.length === 1) return map.setView([last[0].lat, last[0].lng], 12);
    map.fitBounds(L.latLngBounds(last.map(function(p){ return [p.lat, p.lng]; })), { padding: [40, 40], maxZoom: 12 });
  }
  function draw(){
    var seen = {};
    last.forEach(function(p){
      seen[p.key] = 1; var m = markers[p.key];
      if (!m) m = markers[p.key] = L.marker([p.lat, p.lng], { icon: icon(p), riseOnHover: true }).addTo(map);
      else { m.setLatLng([p.lat, p.lng]); m.setIcon(icon(p)); }
      m.bindPopup("<b>" + esc(p.name) + "</b>" + (p.label ? "<br>" + esc(p.label) : "") + "<br>" + esc(p.src) + " · " + esc(ago(p.at)));
    });
    Object.keys(markers).forEach(function(k){ if (!seen[k]) { map.removeLayer(markers[k]); delete markers[k]; } });
    var who = $("who"); who.innerHTML = "";
    last.forEach(function(p){
      var b = document.createElement("button"); b.className = "p";
      b.innerHTML = '<img src="' + esc(artUrl(p.art || "person.svg")) + '" alt=""' + (p.art ? "" : ' style="width:30px;height:34px"') + "><b>" + esc(p.name) + "</b><small>" + esc(sub(p)) + "</small>";
      b.onclick = function(){ findPerson(p); };
      who.appendChild(b);
    });
    if (!last.length) who.innerHTML = '<div class="empty">Nobody is sharing yet</div>';
    if (!fitted && last.length) { fitAll(); fitted = true; }
    setTimeout(spread, 0);
    tellHeight();
  }
  function spread(){ // fan out people who sit on top of each other so every face shows
    var placed = [];
    last.forEach(function(p){
      var m = markers[p.key]; if (!m || !m._icon) return;
      var pt = map.latLngToLayerPoint(m.getLatLng()), dx = 0, tries = 0;
      while (tries++ < 8 && placed.some(function(q){ return Math.abs(q.x - (pt.x + dx)) < 58 && Math.abs(q.y - pt.y) < 48; }))
        dx = dx <= 0 ? -dx + 60 : -dx;
      m._icon.style.marginLeft = (parseFloat(m.options.icon.options.iconAnchor[0]) * -1 + dx) + "px";
      placed.push({ x: pt.x + dx, y: pt.y });
    });
  }
  map.on("zoomend viewreset", spread);
  function findPerson(p){
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 13)); setTimeout(function(){ markers[p.key] && markers[p.key].openPopup(); }, 400);
  }
  function tellHeight(){ try { window.parent.postMessage({ type: "ohana-waldo-height", h: document.documentElement.scrollHeight }, location.origin); } catch (e) {} }
  window.addEventListener("resize", function(){ map.invalidateSize(); tellHeight(); });
  var LINE = "You see family who turn Share on, plus your own Life360 people.", noteT = null;
  function note(t){ var n = $("line"); n.textContent = t; n.classList.add("note"); clearTimeout(noteT); noteT = setTimeout(function(){ n.textContent = LINE; n.classList.remove("note"); }, 4000); }
  function setShare(){ var b = $("share"); b.textContent = sharing ? "Sharing" : "Share: off"; b.className = sharing ? "go" : ""; }
  function send(pos){
    if (!sharing || Date.now() - lastSent < 60000) return; lastSent = Date.now();
    fetch("/people/api/family/spot", { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }) }).then(load);
  }
  function watch(on){
    if (on && navigator.geolocation && watchId == null) watchId = navigator.geolocation.watchPosition(send, function(e){ if (e.code === 1) note("Location is blocked for Ohana on this phone."); }, { enableHighAccuracy: true, maximumAge: 60000, timeout: 30000 });
    if (!on && watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  }
  function demo(){
    var now = Date.now(), t = function(m){ return new Date(now - m * 60000).toISOString(); };
    last = [
      { key: "a", name: "Pe-paw", lat: 37.0670, lng: -93.5520, at: t(1), src: "Ohana", kind: "character", art: "/wardrobe-otto-firefighter-v92.webp", label: "Home" },
      { key: "b", name: "Memaw", lat: 37.2089, lng: -93.2923, at: t(6), src: "Life360", kind: "character", art: "/buddy-pebble.webp?asset=ohana-v105-binary-repair-20261011", label: "Springfield" },
      { key: "c", name: "Ethan", lat: 36.7050, lng: -93.3700, at: t(3), src: "Life360", kind: "place", art: "fire-truck.svg", label: "At the fire station" },
      { key: "d", name: "Eagle", lat: 36.6437, lng: -93.2185, at: t(2), src: "Limo app", kind: "vehicle", art: "pinkey.webp", label: "Pinkey · on a run" },
      { key: "e", name: "MomFudge", lat: 38.6270, lng: -90.1994, at: t(25), src: "Google", kind: "character", art: "/ohana-l07-v1.webp?asset=ohana-v105-binary-repair-20261011", label: "St. Louis" },
      { key: "f", name: "Jeremy", lat: 37.0842, lng: -94.5133, at: t(9), src: "JJ Friends", kind: "vehicle", art: "grand-van.webp", label: "Grand Van · on a run" }
    ];
    draw();
  }
  function load(){
    if (DEMO) return demo();
    if (!tok) { last = []; draw(); LINE = "Sign in to Ohana Home to see the map."; $("line").textContent = LINE; return; }
    var h = { authorization: "Bearer " + tok };
    fetch("/people/api/family", { headers: h, cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(f){
      if (f) { sharing = !!(f.me && f.me.sharing); setShare(); watch(sharing); l360 = f.life360 || { connected: false }; }
      return fetch("/people/api/where", { headers: h, cache: "no-store" }).then(function(r){
        if (r.ok) { admin = true; return r.json().then(function(d){ l360 = (d.sources && d.sources.life360) || { connected: false }; return d; }); }
        return f ? { people: (f.people || []).concat(f.mine || []) } : null;
      });
    }).then(function(d){
      last = ((d && d.people) || []).filter(function(p){ return isFinite(p.lat) && isFinite(p.lng); });
      draw(); setL360();
    }).catch(function(){ note("Can't reach the map right now. Trying again."); });
  }
  function setL360(){
    var b = $("l360"); b.textContent = l360.connected ? (l360.error ? "Life360 needs a new key" : "Life360 on") : "Life360"; b.className = l360.connected && !l360.error ? "go" : "";
    $("ls").textContent = l360.connected ? (l360.error ? "Life360 stopped answering. Paste a fresh key." : "Connected. " + (l360.members || 0) + " of your people coming in.") : "Not connected yet.";
    $("loff").style.display = l360.connected ? "" : "none";
  }
  function sendL360(body){
    if (DEMO) { l360 = body.off ? { connected: false } : { connected: true, members: 4 }; setL360(); return Promise.resolve({ ok: true }); }
    return fetch(admin ? "/people/api/life360" : "/people/api/family/life360", { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  $("l360").onclick = function(){ setL360(); $("lp").classList.toggle("on"); };
  $("lclose").onclick = function(){ $("lp").classList.remove("on"); };
  $("lsave").onclick = function(){
    var k = $("lk").value.trim(); if (!k) return;
    sendL360({ key: k }).then(function(d){
      $("lk").value = "";
      if (!d.ok) { $("ls").textContent = d.error || "That didn't work."; return; }
      if (d.status) l360 = d.status; setL360();
      note(d.status && d.status.error ? "Saved, but Life360 said no. Try a fresh key." : "Life360 connected. Your people are coming in."); load();
    });
  };
  $("loff").onclick = function(){ sendL360({ off: true }).then(function(){ l360 = { connected: false }; setL360(); $("lp").classList.remove("on"); note("Your Life360 is turned off here."); load(); }); };
  $("all").onclick = fitAll;
  $("share").onclick = function(){
    if (DEMO) { sharing = !sharing; setShare(); return note(sharing ? "Your family can see you while Ohana is open." : "Sharing is off. Your spot was removed."); }
    if (!tok) return;
    var on = !sharing;
    fetch("/people/api/family/share", { method: "POST", headers: { authorization: "Bearer " + tok, "content-type": "application/json" }, body: JSON.stringify({ on: on }) })
      .then(function(r){ return r.json(); }).then(function(d){
        if (!d.ok) return; sharing = on; setShare(); lastSent = 0; watch(on);
        note(on ? "Your family can see you while Ohana is open." : "Sharing is off. Your spot was removed."); load();
      });
  };
  load(); if (!DEMO) setInterval(load, 30000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && !DEMO) load(); });
})();
</script>
</body>
</html>
